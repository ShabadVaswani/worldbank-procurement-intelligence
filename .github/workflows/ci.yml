# Lint and unit tests for the pure-Python package (src/proc_intel) on every push and pull request.
# The notebooks run on Databricks and are not executed here; their shared logic lives in src/ and is tested here.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]   # 3.12 = Databricks Runtime 18 LTS
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install
        run: python -m pip install -r requirements-dev.txt ruff
      - name: Lint (ruff, config in pyproject.toml)
        run: ruff check src tests
      - name: Unit tests
        run: python -m pytest -q
