<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 520" width="1150" height="520" font-family="Inter, 'Segoe UI', Arial, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A94A6"/></marker></defs><rect width="1150" height="520" fill="#FFFFFF"/><rect x="30" y="40" width="250" height="86" rx="6" fill="#EEF4FB" stroke="#1F3A5F" stroke-width="1.2"/><text x="39" y="57" font-size="12" font-weight="600" fill="#1F3A5F" text-anchor="start">1  Daily MERGE</text><text x="39" y="73" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">awards + notices;</text><text x="39" y="87" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">unchanged rows untouched</text><rect x="310" y="40" width="250" height="86" rx="6" fill="#EEF4FB" stroke="#1F3A5F" stroke-width="1.2"/><text x="319" y="57" font-size="12" font-weight="600" fill="#1F3A5F" text-anchor="start">2  Change Data Feed</text><text x="319" y="73" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">changed keys since</text><text x="319" y="87" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">the last checkpoint</text><rect x="590" y="40" width="250" height="86" rx="6" fill="#E6F4F1" stroke="#0F766E" stroke-width="1.2"/><text x="599" y="57" font-size="12" font-weight="600" fill="#1F3A5F" text-anchor="start">3  Graph MERGE</text><text x="599" y="73" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">notice neighbourhood in</text><text x="599" y="87" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">one commit; refresh queue</text><rect x="870" y="40" width="250" height="86" rx="6" fill="#E6F4F1" stroke="#0F766E" stroke-width="1.2"/><text x="879" y="57" font-size="12" font-weight="600" fill="#1F3A5F" text-anchor="start">4  Re-embed</text><text x="879" y="73" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">only new or changed</text><text x="879" y="87" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">passages (content hash)</text><rect x="870" y="210" width="250" height="86" rx="6" fill="#E6F4F1" stroke="#0F766E" stroke-width="1.2"/><text x="879" y="227" font-size="12" font-weight="600" fill="#1F3A5F" text-anchor="start">5  Drift checks</text><text x="879" y="243" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">PSI on inputs, KS on</text><text x="879" y="257" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">durations; signing-date windows</text><rect x="870" y="380" width="250" height="86" rx="6" fill="#E6F4F1" stroke="#0F766E" stroke-width="1.2"/><text x="879" y="397" font-size="12" font-weight="600" fill="#1F3A5F" text-anchor="start">6  Retrain trigger</text><text x="879" y="413" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">drift, error or age, and</text><text x="879" y="427" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">&gt;= 1,000 new labels</text><rect x="590" y="380" width="250" height="86" rx="6" fill="#EEF4FB" stroke="#1F3A5F" stroke-width="1.2"/><text x="599" y="397" font-size="12" font-weight="600" fill="#1F3A5F" text-anchor="start">7  Champion / challenger</text><text x="599" y="413" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">same newest window, by</text><text x="599" y="427" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">segment; move @champion</text><rect x="310" y="380" width="250" height="86" rx="6" fill="#EEF4FB" stroke="#1F3A5F" stroke-width="1.2"/><text x="319" y="397" font-size="12" font-weight="600" fill="#1F3A5F" text-anchor="start">8  New ICRs, IEG reviews</text><text x="319" y="413" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">evidence tables and</text><text x="319" y="427" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">lessons corpus updated</text><rect x="30" y="380" width="250" height="86" rx="6" fill="#EEF4FB" stroke="#1F3A5F" stroke-width="1.2"/><text x="39" y="397" font-size="12" font-weight="600" fill="#1F3A5F" text-anchor="start">9  Pilot KPIs, feedback</text><text x="39" y="413" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">refreshed daily;</text><text x="39" y="427" font-size="11" font-weight="400" fill="#1F2937" text-anchor="start">back to the backlog</text><line x1="280" y1="83.0" x2="308" y2="83.0" stroke="#8A94A6" stroke-width="1.4" marker-end="url(#arrow)"/><line x1="560" y1="83.0" x2="588" y2="83.0" stroke="#8A94A6" stroke-width="1.4" marker-end="url(#arrow)"/><line x1="840" y1="83.0" x2="868" y2="83.0" stroke="#8A94A6" stroke-width="1.4" marker-end="url(#arrow)"/><line x1="995.0" y1="126" x2="995.0" y2="208" stroke="#8A94A6" stroke-width="1.4" marker-end="url(#arrow)"/><line x1="995.0" y1="296" x2="995.0" y2="378" stroke="#8A94A6" stroke-width="1.4" marker-end="url(#arrow)"/><line x1="870" y1="423.0" x2="842" y2="423.0" stroke="#8A94A6" stroke-width="1.4" marker-end="url(#arrow)"/><line x1="590" y1="423.0" x2="562" y2="423.0" stroke="#8A94A6" stroke-width="1.4" marker-end="url(#arrow)"/><line x1="310" y1="423.0" x2="282" y2="423.0" stroke="#8A94A6" stroke-width="1.4" marker-end="url(#arrow)"/><line x1="155.0" y1="380" x2="155.0" y2="128" stroke="#8A94A6" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="310" y="168" width="530" height="170" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/><text x="575" y="196" font-size="13" font-weight="700" fill="#1F3A5F" text-anchor="middle">Proof on a replay of real notices</text><text x="330" y="224" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">7 held-back days + 100 corrected notices</text><text x="330" y="246" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">bronze: 934 inserts, 100 updates</text><text x="330" y="268" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">graph: 3,290 inserts, 50 deletes (not 1.36M rewritten)</text><text x="330" y="290" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">incremental = full rebuild = production: 0 differences</text><text x="330" y="312" font-size="12" font-weight="400" fill="#1F2937" text-anchor="start">drift on the latest run: stable (PSI &lt;= 0.085)</text><text x="30" y="506" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start">Teal: model and index maintenance. Rollback = move the @champion alias back; serving code never changes.</text></svg>
