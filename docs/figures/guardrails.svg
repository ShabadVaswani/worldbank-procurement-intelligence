<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" width="1100" height="470" font-family="Inter, 'Segoe UI', Arial, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A94A6"/></marker></defs><rect width="1100" height="470" fill="#FFFFFF"/><rect x="16" y="20" width="1068" height="44" rx="6" fill="#EEF4FB" stroke="#B45309" stroke-width="1.2"/><text x="32" y="47" font-size="13" font-weight="700" fill="#1F3A5F" text-anchor="start">1  Input guard</text><text x="290" y="47" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">a second model family classifies scope and injection; free text is wrapped as data</text><text x="1068" y="47" font-size="10.5" font-weight="600" fill="#B45309" text-anchor="end">model</text><rect x="22" y="74" width="1056" height="44" rx="6" fill="#E6F4F1" stroke="#0F766E" stroke-width="1.2"/><text x="38" y="101" font-size="13" font-weight="700" fill="#1F3A5F" text-anchor="start">2  Tool arguments</text><text x="290" y="101" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">schema check, numeric coercion, country and method resolution; invalid calls counted</text><text x="1062" y="101" font-size="10.5" font-weight="600" fill="#0F766E" text-anchor="end">code</text><rect x="28" y="128" width="1044" height="44" rx="6" fill="#EEF4FB" stroke="#8A94A6" stroke-width="1.2"/><text x="44" y="155" font-size="13" font-weight="700" fill="#1F3A5F" text-anchor="start">3  Evidence only from tools</text><text x="290" y="155" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">records passed as delimited blocks with ids; tool output is data, not instructions</text><text x="1056" y="155" font-size="10.5" font-weight="600" fill="#8A94A6" text-anchor="end">prompt</text><rect x="34" y="182" width="1032" height="44" rx="6" fill="#E6F4F1" stroke="#0F766E" stroke-width="1.2"/><text x="50" y="209" font-size="13" font-weight="700" fill="#1F3A5F" text-anchor="start">4  Evidence strength</text><text x="290" y="209" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">weak precedents, no benchmark or distant lessons -&gt; 'insufficient evidence'</text><text x="1050" y="209" font-size="10.5" font-weight="600" fill="#0F766E" text-anchor="end">code</text><rect x="40" y="236" width="1020" height="44" rx="6" fill="#E6F4F1" stroke="#0F766E" stroke-width="1.2"/><text x="56" y="263" font-size="13" font-weight="700" fill="#1F3A5F" text-anchor="start">5  Citation validation</text><text x="290" y="263" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">ids no tool returned are dropped; uncited risks removed; status lowered</text><text x="1044" y="263" font-size="10.5" font-weight="600" fill="#0F766E" text-anchor="end">code</text><rect x="46" y="290" width="1008" height="44" rx="6" fill="#E6F4F1" stroke="#0F766E" stroke-width="1.2"/><text x="62" y="317" font-size="13" font-weight="700" fill="#1F3A5F" text-anchor="start">6  Numeric check</text><text x="290" y="317" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">timeline numbers must match the cited benchmark or model forecast</text><text x="1038" y="317" font-size="10.5" font-weight="600" fill="#0F766E" text-anchor="end">code</text><rect x="52" y="344" width="996" height="44" rx="6" fill="#E6F4F1" stroke="#0F766E" stroke-width="1.2"/><text x="68" y="371" font-size="13" font-weight="700" fill="#1F3A5F" text-anchor="start">7  Conflict flags</text><text x="290" y="371" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">disagreeing sources shown side by side with dates, flag and confidence</text><text x="1032" y="371" font-size="10.5" font-weight="600" fill="#0F766E" text-anchor="end">code</text><rect x="58" y="398" width="984" height="44" rx="6" fill="#EEF4FB" stroke="#1F3A5F" stroke-width="1.2"/><text x="74" y="425" font-size="13" font-weight="700" fill="#1F3A5F" text-anchor="start">8  Trace and human review</text><text x="290" y="425" font-size="11.5" font-weight="400" fill="#1F2937" text-anchor="start">MLflow trace per run; feedback stored with model and prompt version</text><text x="1026" y="425" font-size="10.5" font-weight="600" fill="#1F3A5F" text-anchor="end">people</text><text x="16" y="458" font-size="11" font-weight="400" fill="#5B6472" text-anchor="start">Teal layers are deterministic code with unit tests; they run whatever the model writes.</text></svg>
