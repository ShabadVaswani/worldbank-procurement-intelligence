tion works were noticed due to the low capacity of engaged local contractors and subcontractors. Furthermore, there were cases of insufficient quality of the embedded materials and lack o"}], "actual": "signed 2025-12-30, 579 days from notice to signing (slow for its peer group: yes); model A range P10-P90 179-654 days, P50 369"}, {"id": "r15", "country": "UG", "category": "NC", "method": "Request for Proposals", "notice_date": "2024-06-28", "description": "Upgrade of Data exchange and Integration Platform to on-board more agencies", "brief": "Package: The package involves upgrading a Data Exchange and Integration Platform to on-board more agencies in Uganda using the Request for Proposals method.\nStatus: complete\n\nTimeline: The timeline forecast relies on assumptions regarding notice type, advertising period, notice length, and language, but does not account for specific project readiness or staffing constraints. [forecast:ecf170422fe6, benchmark:category-05e384c9]\n  model forecast for this package: median 311 days from tender notice to signing (P10 153, P90 544); probability of a slow tender 62% [forecast:ecf170422fe6]\n  peer group: median 133 days; 90th percentile 330 days [benchmark:category-05e384c9]\n  the forecast median is 178 days longer than the peer-group median\n\nMarket approach: Proceed with Request for Proposals as the method, consistent with the single close precedent which utilized this method for a similar Health Information Exchange Platform design and supply package. [contract:1617942]\n\nRisks and mitigations:\n  1. Insufficient procurement staff experience and inadequate record-keeping arrangements may cause delays in processing. -> Recruit additional qualified staff and provide hands-on support through training and the use of the STEP system. [document_chunk:P176181_34049907_0105]\n  2. Lack of experience and inadequate capacity in the implementing agency can lead to poor internal processes and inertia in decision-making. -> Conduct more upfront work during preparation, including clarity on implementation arrangements and early finalization of technical specifications. [lesson_chunk:P145502-33841581-0067]\n  3. Delays in approval of bid evaluation reports and contracts due to the national public procurement system or overloaded PIUs. -> Update the Procurement Implementation Manual and ensure the PIU is adequately staffed to handle the workload. [document_chunk:P176932_34196069_0172]\n  4. Confusion between the New Procurement Framework and national regulations or former guidelines may lead to mis-procurement. -> Provide specific training for staff on the New Procurement Framework and World Bank regulations. [document_chunk:P173240_33706639_0167]\n\nSimilar precedents:\n  - contract:1617942 MN-MOH-78892-NC-RFB-Design, supply, installation and piloting of Health Information Exchange Platform: This contract involved the design, supply, and installation of a Health Information Exchange Platform using Request for Proposals, closely matching the current package's scope and method.", "cited": [{"record_id": "benchmark:category-05e384c9", "text": "tender notice to signing, peer group: all regions and methods, NC | P10/P50/P90 52.0/133.0/330.0 days, n=652"}, {"record_id": "contract:1617942", "text": "MN-MOH-78892-NC-RFB-Design, supply, installation and piloting of Health Information Exchange Platform | MN, Request for Proposals, signed 2020-08-19, 614 days, winner SE-120492 TAIHAN ELECTRIC WIRE CO.; SE-410960 BIT COMPUTER CO., LTD"}, {"record_id": "document_chunk:P173240_33706639_0167", "text": "Project Appraisal Document / OVERALL FM RISK H S > E. Procurement |  | An assessment of the capacity of MINPOSTEL and the PIU to implement procurement activities was carried out, which reviewed the organizational structure for the project’s implementation, the PIU to put in place, and the interaction between the different agencies involved in the project. MINPOSTEL has"}, {"record_id": "document_chunk:P176181_34049907_0105", "text": "Project Appraisal Document / IV. PROJECT APPRAISAL SUMMARY > B. Fiduciary |  | For the RECs, EAC, and IGAD, where existing PIUs will be leveraged, risks primarily include inadequate number of staff or record-keeping arrangements and related delays in processing. These are expected to be mitigated through recruitment of additional staff and hands-on support from the World Bank"}, {"record_id": "document_chunk:P176932_34196069_0172", "text": "Project Appraisal Document / AU SAA ECOWAS |  | There are significant time delays in the procurement process. The overall procurement risk is high. The residual risk is expected to be substantial once the mitigation measures are implemented. 39. Mauritania. The risks are associated with the current national public procurement system, delays in ap"}, {"record_id": "forecast:ecf170422fe6", "text": "model forecast of tender notice to signing for this package (P10-P90 is an 80% interval) | model P10/P50/P90 153.0/311.0/544.0 days, slow probability 0.62"}, {"record_id": "lesson_chunk:P145502-33841581-0067", "text": "Implementation Completion and Results Report / V. LESSONS AND RECOMMENDATIONS |  | Lesson: Dilution of readiness criteria during project preparation can adversely impact project implementation. Readiness filters are set keeping in mind the country and institutional context. Accelerated preparation timelines and not meeting the country readiness conditions can set the project up fo"}], "actual": "signed 2025-06-20, 357 days from notice to signing (slow for its peer group: yes); model A range P10-P90 175-609 days, P50 376"}, {"id": "r16", "country": "7C", "category": "GO", "method": "Request for Bids", "notice_date": "2024-09-06", "description": "Procurement of engineering equipment for MoES KR", "brief": "Package: This package involves the procurement of engineering equipment for the Ministry of Education and Science in country 7C using the Request for Bids method.\nStatus: complete\n\nTimeline: The foreca 13151-31101058-0159]\n\nSimilar precedents:\n  - contract:1613634 Procurement of: Engineering Equipment for EQRA Project: Procurement of engineering equipment using Request for Bids in a similar regional context.\n  - contract:1647212 Procurement of Engineering Equipment: Procurement of engineering equipment, though using Request for Quotations for a smaller value.\n  - contract:1595459 Procurement of Engineering Material Equipment for Engineering Material Division of Irrigation department Contract No: CRIP/GOODS/NCB/63 \nLot 2 - Resisitivity Im: Procurement of engineering material equipment using Request for Bids for irrigation division.\n  - contract:1595457 Procurement of Engineering Material Equipment for Engineering Material Division of Irrigation department\nContract No: CRIP/GOODS/NCB/63\nLot 1 - Concrete Grindin: Procurement of engineering material equipment using Request for Bids for irrigation division.\n  - contract:1595458 Procurement of Engineering Material Equipment for Engineering Material Division of Irrigation department Contract No: CRIP/GOODS/NCB/63 \nLot 3 - Digitally Instr: Procurement of engineering material equipment using Request for Bids for irrigation division.", "cited": [{"record_id": "benchmark:country_method_category-40660b44", "text": "tender notice to signing, peer group: 7C, Request for Bids, GO | P10/P50/P90 53.0/116.0/150.0 days, n=50"}, {"record_id": "contract:1595457", "text": "Procurement of Engineering Material Equipment for Engineering Material Division of Irrigation department\nContract No: CRIP/GOODS/NCB/63\nLot 1 - Concrete Grindin | LK, Request for Bids, signed 2019-09-10, None days, winner SE-349118 BHOOMI -TECH (PVT) LTD"}, {"record_id": "contract:1595458", "text": "Procurement of Engineering Material Equipment for Engineering Material Division of Irrigation department Contract No: CRIP/GOODS/NCB/63 \nLot 3 - Digitally Instr | LK, Request for Bids, signed 2019-09-10, None days, winner SE-349118 BHOOMI -TECH (PVT) LTD"},  Procurement |  | 68. Procurement processes constituted one of the main factors of delay which made necessary several extensions of the loan’s closing date. In spite of its centralized approach and the proven capacity of the PCU and DiGePPSE, the involvement –and coordination wi"}, {"record_id": "lesson_chunk:P145529-34182967-0074", "text": "Implementation Completion and Results Report / II. KEY FACTORS THAT AFFECTED IMPLEMENTATION AND OUTCOME > B. KEY FACTORS DURING IMPLEMENTATION |  | 58. The Project suffered from payment delays that affected contractors, but several actions were taken to address this problem. Delays in payment were due to: (i) several instances of postponed commissioning (when, for example, the delayed finalization"}], "actual": "signed 2025-07-08, 305 days from notice to signing (slow for its peer group: yes); model A range P10-P90 67-229 days, P50 134"}, {"id": "r17", "country": "PK", "category": "GO", "method": "Request for Bids", "notice_date": "2024-01-15", "description": "Procurement of Hardware for Cloud, High-Performance Computing and Network Security", "brief": "Package: The package covers the procurement of hardware for cloud, high-performance computing, and network security in Pakistan under the Request for Bids method.\nStatus: complete\n\nTimeline: The timeline forecast assumes an Invitation for Bids notice type, a 30-day advertising period, a 5949-character notice length, and English language, but does not account for specific project implementation constraints. [forecast:99d241f3d48d, benchmark:country_method_category-e2179320]\n  model forecast for this package: median 128 days from tender notice to signing (P10 67, P90 218); probability of a slow tender 12% [forecast:99d241f3d48d]\n  peer group: median 129 days; 90th percentile 287 days [benchmark:country_method_category-e2179320]\n  the forecast median is 1 days shorter than the peer-group median\n\nMarket approach: Proceed with Request for Bids as the primary method, consistent with the planned notice and precedents for similar high-value IT hardware and cloud infrastructure packages in the region and globally. [contract:1800554, contract:1639517, contract:1706073, contract:1753939, benchmark:country_method_category-e2179320]\n\nRisks and mitigations:\n  1. Delays in implementation may occur due to lengthy internal approval processes for procurement plans and technical specifications. -> Establish a clear timeline for internal approvals and ensure technical specifications are finalized before the tender notice is issued. [lesson_chunk:P113151-31101058-0159]\n  2. Limited local market capacity may result in fewer interested suppliers and higher bid prices. -> Conduct early market engagement to gauge interest and consider international competition to ensure value for money. [document_chunk:P162454_31019366_0053]\n  3. Weak contract management capabilities could lead to delays during contract implementation. -> Recruit or assign a dedicated contract management specialist and provide training on World Bank procurement procedures. [lesson_chunk:P113151-31101058-0159, lesson_chunk:P123093-33890523-0089]\n  4. Institutional challenges, such as delayed tax exemption requests, may cause significant implementation delays. -> Initiate tax exemption requests early in the procurement process and coordinate closely with relevant government authorities. [lesson_chunk:P125565-34219519-0070]\n\nSimilar precedents:\n  - contract:1800554 Supply, Installation, Configuration & Commissioning of Lot-3 i.e. Laptops/Desktops/Printers/LED under Procurement of IT Hardware & Equipment, Khyber Pakhtunkhwa: Similar procurement of IT hardware including laptops and desktops in Pakistan using Request for Bids.\n  - contract:1743544 Procurement of IT hardware to Data Centres: Procurement of IT hardware for data centers, relevant to the cloud and high-performance computing focus.\n  - contract:1639517 Implementation of the Management Information System. Hardware (Enterprise Computing Cloud): Implementation of enterprise computing cloud hardware using Request for Bids.\n  - contract:1706073 Procurement of High Performance Computer: Procurement of high-performance computers using Request for Bids in a similar regional context.\n  - contract:1753939 Procurement of Hardware and Network Infrastructure for COTS: Procurement of hardware and network infrastructure for COTS using Request for Bids.", "cited": [{"record_id": "benchmark:country_method_category-e2179320", "text": "tender notice to signing, peer group: PK, Request for Bids, GO | P10/P50/P90 66.0/129.0/287.0 days, n=268"}, {"record_id": "contract:1639517", "text": "Implementation of the Management Information System. Hardware (Enterprise Computing Cloud) | UA, Request for Bids, signed 2021-03-09, 354 days, winner SE-80292 R.I.S.K."}, {"record_id": "contract:1706073", "text": "Procurement of High Performance Computer | BD, Request for Bids, signed 2022-07-20, 240 days, winner SE-626181-2 ELSIS PRO UAB"}, {"record_id": "contract:1743544", "text": "Procurement of IT hardware to Data Centres | IN, Request for Quotations, signed 2022-12-20, None days, winner SE-779415 SAUTHRIKA TECHNOLOGIES & INFRA PRIVATE LIMITED"}, {"record_id": "contract:1753939", "text": "Procurement of Hardware and Network Infrastructure for COTS | RS, Request for Bids, signed 2023-08-25, 107 days, winner SE-308629 ASSECO SEE DOO BEOGRAD"}, {"record_id": "contract:1800554", "text": "Supply, Installation, Configuration & Commissioning of Lot-3 i.e. Laptops/Desktops/Printers/LED under Procurement of IT Hardware & Equipment, Khyber Pakhtunkhwa | PK, Request for Bids, signed 2023-05-15, None days, winner SE-901318 INGRO MICRO"}, {"record_id": "document_chunk:P162454_31019366_0053", "text": "Project Appraisal Document / VI. APPRAISAL SUMMARY > D. Procurement |  | This is further compounded by limited human capital for procurement management, as commonly evidenced by delays in decision making. In addition, there is a general lack of emphasis on procurement principals in such areas as transparency, conflict of interest, independent complaint mechanism, value f"}, {"record_id": "forecast:99d241f3d48d", "text": "model forecast of tender notice to signing for this package (P10-P90 is an 80% interval) | model P10/P50/P90 67.0/128.0/218.0 days, slow probability 0.12"}, {"record_id": "lesson_chunk:P113151-31101058-0159", "text": "Implementation Completion and Results Report / IV. Procurement |  | Procurement being conducted was generally acceptable to the Bank. Procurement performance was therefore rated Moderately Satisfactory during the project implementation. The procurement plan was cleared by the Bank and approved by MONRE/MPI from Project start and was subject to various updates to acc"}, {"record_id": "lesson_chunk:P123093-33890523-0089", "text": "Implementation Completion and Results Report / IV. BANK PERFORMANCE, COMPLIANCE ISSUES, AND RISK TO DEVELOPMENT OUTCOME > Procurement |  | 70. Mauritania: The procurement assessment for Mauritania is based on implementation progress, the project's procurement plan, and the application of the recommendations of the aide-memoires of the supervision missions. During implementation, there were conside"}, {"record_id": "lesson_chunk:P125565-34219519-0070", "text": "Implementation Completion and Results Report / III. KEY FACTORS THAT AFFECTED IMPLEMENTATION AND OUTCOME > B. KEY FACTORS DURING IMPLEMENTATION |  | 55. Institutional challenges. As outlined above, SENELEC remained stressed at operational and financial levels which contributed to delays in the earlier stages of implementation, including in the co-financing of components. While the operational and "}], "actual": "signed 2025-01-10, 361 days from notice to signing (slow for its peer group: yes); model A range P10-P90 51-196 days, P50 104"}, {"id": "r18", "country": "TO", "category": "NC", "method": "Request for Proposals", "notice_date": "2023-12-07", "description": "Design, Supply and Installation of an Integrated Forecast Platform (IFP) for the Tonga Meteorological Services(TMS)", "brief": "Package: The package covers the Design, Supply and Installation of an Integrated Forecast Platform for the Tonga Meteorological Services under the Request for Proposals method.\nStatus: complete\n\nTimeline: The timeline forecast relies on model assumptions regarding notice type, advertising period, notice length, and language, while the peer group benchmark is based on the category level due to insufficient data at the region-method level. [forecast:02e4906b9ca6, benchmark:category-05e384c9]\n  model forecast for this package: median 275 days from tender notice to signing (P10 146, P90 526); probability of a slow tender 53% [forecast:02e4906b9ca6]\n  peer group: median 133 days; 90th percentile 330 days [benchmark:category-05e384c9]\n  the forecast median is 142 days longer than the peer-group median\n\nMarket approach: Proceed with Request for Proposals as the planned method, informed by the precedent of a similar integrated system contract awarded via Request for Bids with 8 firms and the benchmark data for NC category contracts. [contract:1611409, benchmark:category-05e384c9]\n\nRisks and mitigations:\n  1. Procurement delays may occur due to low capacity and limited competition in the market. -> Recruit a procurement consultant familiar with Bank procedures and advertise notices widely to attract international bids. [lesson_chunk:P120788-34204838-0183]\n  2. Delays in contract signing may result from delayed approvals of procurement plans and terms of reference by government bodies. -> Develop initial procurement plans covering the entire project period and refine them with Bank assistance before negotiations. [lesson_chunk:P092429-33863468-0073, lesson_chunk:P120788-34204838-0183]\n  3. Inadequate procurement staff or record-keeping arrangements may cause processing delays. -> Recruit additional qualified staff and utilize the STEP system with hands-on implementation support from the World Bank. [document_chunk:P180171_34058464_0082]\n  4. Complex ICT services procurement may face lengthier evaluation and selection processes due to market scarcity and strict rules. -> Engage in pre-market strategies such as supplier briefings and ensure clear technical requirements are elaborated early. [lesson_chunk:P092429-33863468-0073, lesson_chunk:P120788-34204838-0183]\n\nSimilar precedents:\n  - contract:1611409 Design, Supply and Installation of Integrated Enterprise Information Management System (IMS) including Hardware: Similar scope involving design, supply, and installation of an integrated information management system with hardware.\n\nEvidence gaps:\n  - No benchmark record was chosen for the specific region and method combination due to insufficient contract data.", "cited": [{"record_id": "benchmark:category-05e384c9", "text": "tender notice to signing, peer group: all regions and methods, NC | P10/P50/P90 52.0/133.0/330.0 days, n=652"}, {"record_id": "contract:1611409", "text": "Design, Supply and Installation of Integrated Enterprise Information Management System (IMS) including Hardware | GM, Request for Bids, signed 2020-04-20, 398 days, winner SE-427192 INDRA SOLUCIONES TECNOLOGIAS DE LA INFORMACION SLU"}, {"record_id": "document_chunk:P180171_34058464_0082", "text": "Project Appraisal Document / PROJECT APPRAISAL SUMMARY > B. Fiduciary |  | Procurement assessments were completed for all the implementing agencies in accordance with the World Bank Procurement Risk Assessment and Management System. 84. The overall residual risk for procurement is rated Substantial. In Comoros, Mozambique, SADC, ENTRO, and Madagascar, the residual risk is"}, {"record_id": "forecast:02e4906b9ca6", "text": "model forecast of tender notice to signing for this package (P10-P90 is an 80% interval) | model P10/P50/P90 146.0/275.0/526.0 days, slow probability 0.53"}, {"record_id": "lesson_chunk:P092429-33863468-0073", "text": "Implementation Completion and Results Report / III. KEY FACTORS THAT AFFECTED IMPLEMENTATION AND OUTCOME > B. KEY FACTORS DURING IMPLEMENTATION |  | 88. Factors under GOR control: - Delayed approvals of annual project budgets, implementation and procurement plans by the MOF at early years of project implementation further delayed the contracts signing. - Protracted mutual acceptance of the procure"}, {"record_id": "lesson_chunk:P120788-34204838-0183", "text": "Implementation Completion and Results Report / BASIC INFORMATION AND PROJECT BACKGROUND > Key Factors Affecting Implementation and Outcomes |  | Procurement. During the first phase the main procurement risk was potential delays due to low capacity. Another risk was that there is little competition in procurement due to the high cost of doing business in the region and limited development in the lo"}], "actual": "signed 2024-05-20, 165 days from notice to signing (slow for its peer group: no); model A range P10-P90 171-607 days, P50 313"}, {"id": "r19", "country": "BD", "category": "CS", "method": "Quality And Cost-Based Selection", "notice_date": "2024-06-10", "description": "Selection of Service Provider for operating VLTC at Khulna Division", "brief": "Package: This package involves the Quality and Cost-Based Selection of a service provider to operate the VLTC at Khulna Division in Bangladesh.\nStatus: partial\n\nTimeline: The timeline forecast relies on assumptions regarding the notice type being a Request for Expression of Interest, an 18-day advertising period, a notice length of 6867 characters, and English language usage. [forecast:7156fb655048, benchmark:country_method_category-9a6caf5a]\n  model forecast for this package: median 390 days from tender notice to signing (P10 200, P90 649); probability of a slow tender 38% [forecast:7156fb655048]\n  peer group: median 400 days; 90th percentile 641 days [benchmark:country_method_category-9a6caf5a]\n  the forecast median is 10 days shorter than the peer-group median\n\nMarket approach: Proceed with Quality and Cost-Based Selection as the method, informed by 95 precedents in Bangladesh for this category and method which show a median duration of 400 days. [benchmark:country_method_category-9a6caf5a]\n\nRisks and mitigations:\n  1. Operational delays may occur if the client lacks adequate capacity or fails to include project expenditures in the national budgetary law early. -> Ensure closer follow-up on project implementation readiness and secure early budgetary inclusion to enable timely mobilization. [lesson_chunk:P158982-34302327-0087]\n  2. Contractor performance may be poor if the selected firm lacks competency or engages in excessive subcontracting without adequate supervision. -> Establish strict qualification criteria based on past performance and financial capability, and enforce monitoring to prevent unauthorized subcontracting. [lesson_chunk:P102368-34010353-0067, lesson_chunk:P123828-34118211-0115]\n  3. Procurement timelines may be disrupted by delays in finalizing designs and drawings before the bidding process begins. -> Prioritize the finalization of all designs and bid documents prior to launching the procurement process to avoid schedule slippage. [lesson_chunk:P123828-34118211-0065]\n\nSimilar precedents:\n  none (no close precedent found)\n\nEvidence gaps:\n  - no close precedent found", "cited": [{"record_id": "benchmark:country_method_category-9a6caf5a", "text": "tender notice to signing, peer group: BD, Quality And Cost-Based Selection, CS | P10/P50/P90 224.0/400.0/641.0 days, n=95"}, {"record_id": "forecast:7156fb655048", "text": "model forecast of tender notice to signing for this package (P10-P90 is an 80% interval) | model P10/P50/P90 200.0/390.0/649.0 days, slow probability 0.38"}, {"record_id": "lesson_chunk:P102368-34010353-0067", "text": "Implementation Completion and Results Report / III. KEY FACTORS THAT AFFECTED IMPLEMENTATION AND OUTCOME > B. KEY FACTORS DURING IMPLEMENTATION |  | several times between the RD, the SMU, and the transport hub at the Ministry of Transport and Communication (MTC). 60. The decision to select one contractor to implement both packages of the OPRC (1 and 2) resulted in both contracts being subjected to"}, {"record_id": "lesson_chunk:P123828-34118211-0065", "text": "Implementation Completion and Results Report / IV. BANK PERFORMANCE, COMPLIANCE ISSUES, AND RISK TO DEVELOPMENT OUTCOME > Procurement |  | 69. Procurement performance during the implementation fluctuated between Satisfactory and Moderately Satisfactory. It was initially rated Moderately Satisfactory; however, as the project gained momentum, the PIU was able to frame reasonable competitive qualific"}, {"record_id": "lesson_chunk:P123828-34118211-0115", "text": "Implementation Completion and Results Report / ANNEX 5. BORROWER, CO-FINANCIER AND OTHER PARTNER/STAKEHOLDER COMMENTS > Drawback in Design |  | In LGED context, when piloting period is over, it again became unattended, continuous routine maintenance was not resumed by LGED, so the effort of piloting went in vain. PBMC was not continued or PBMC was not replicated in other RRs. We make an overview o"}, {"record_id": "lesson_chunk:P158982-34302327-0087", "text": "Implementation Completion and Results Report / V. LESSONS AND RECOMMENDATIONS |  | 71. Reliance on specialized partners was key to attenuating a low-capacity implementation environment given the complexity of the Project’s governance and activities. The multisector nature of the Project meant several government entities were involved of implementing arrangements, which could have"}], "actual": "signed 2026-07-16, 766 days from notice to signing (slow for its peer group: yes); model A range P10-P90 200-650 days, P50 376"}, {"id": "r20", "country": "IN", "category": "GO", "method": "Request for Bids", "notice_date": "2024-06-21", "description": "SUPPLY, INSTALLATION, TESTING, COMMISSIONING, TRAINING AND OPERATION & MAINTENANCE OF EQUIPMENT’S, INSTRUMENTATION & TOOLS FOR CARPENTRY WORKSHOP AT PHYSICAL MODELLING CENTRE (PMC), CENTRE OF EXCELLENCE (COE)  BIRPUR, SUPAUL, BIHAR", "brief": "Package: The package covers the supply, installation, testing, commissioning, training, and operation and maintenance of equipment, instrumentation, and tools for a carpentry workshop at the Physical Modelling Centre in Birpur, Supaul, Bihar.\nStatus: complete\n\nTimeline: The timeline forecast relies on model assumptions regarding notice type, advertising period, notice length, and language, while the peer group benchmark is based on the country-specific peer group for India using Request for Bids for Goods. [forecast:3de84dd731b0, benchmark:country_method_category-a2e45100]\n  model forecast for this package: median 131 days from tender notice to signing (P10 64, P90 243); probability of a slow tender 16% [forecast:3de84dd731b0]\n  peer group: median 154 days; 90th percentile 307 days [benchmark:country_method_category-a2e45100]\n  the forecast median is 23 days shorter than the peer-group median\n\nMarket approach: Proceed with Request for Bids as the procurement method, consistent with precedents for similar equipment supply and installation packages in the region and the planned notice method, noting that precedents show varying numbers of firms in award notices ranging from 1 to 8. [contract:1650502, contract:1777053, benchmark:country_method_category-a2e45100]\n\nRisks and mitigations:\n  1. Procurement delays may occur due to limited capacity of procurement staff or frequent staff turnover within the implementing unit. -> Ensure adequate capacity by recruiting additional senior procurement staff or securing temporary support from other projects to manage the workload. [lesson_chunk:P122007-34335229-0075, lesson_chunk:P151449-34305159-0090]\n  2. Implementation delays may arise from poor quality contract amendments or changes in scope requiring multiple rounds of review. -> Provide proactive guidance and ensure high-quality preparation of amendments to minimize review cycles and avoid scope-related delays. [lesson_chunk:P122007-34335229-0075, lesson_chunk:P151832-33952864-0065]\n  3. Payment delays to contractors may result from postponed commissioning or lengthy technical reviews of invoices. -> Reinforce coordination within departments to reduce invoice processing times and avoid retaining contract guarantees until all systems are tested. [lesson_chunk:P145529-34182967-0074]\n  4. Operational delays may stem from the non-inclusion of project expenditures in the national budgetary law, hindering mobilization. -> Ensure early integration of project expenditures in the client's budgetary law to facilitate timely mobilization and start of procurement processes. [lesson_chunk:P158982-34302327-0087]\n\nSimilar precedents:\n  - contract:1650502 Purchase of equipment and tools including installation, testing and commissioning: Similar scope involving purchase of equipment and tools including installation, testing, and commissioning.\n  - contract:1777053 Supply, Installation, Testing, Commissioning and Training of Workshop Equipment for the Center of Excellence in Aviation and Transport Operations: Directly matches the scope of supply, installation, testing, commissioning, and training of workshop equipment for a Center of Excellence.", "cited": [{"record_id": "benchmark:country_method_category-a2e45100", "text": "tender notice to signing, peer group: IN, Request for Bids, GO | P10/P50/P90 66.0/154.0/307.0 days, n=216"}, {"record_id": "contract:1650502", "text": "Purchase of equipment and tools including installation, testing and commissioning | 3E, Request for Bids, signed 2021-03-23, 271 days, winner SE-461755 INTERTEC; SE-477094 INTERTECH GROUP"}, {"record_id": "contract:1777053", "text": "Supply, Installation, Testing, Commissioning and Training of Workshop Equipment for the Center of Excellence in Aviation and Transport Operations | 3E, Request for Bids, signed 2024-01-05, 81 days, winner SE-1023829 EVOLVE CO. LTD"}, {"record_id": "forecast:3de84dd731b0", "text": "model forecast of tender notice to signing for this package (P10-P90 is an 80% interval) | model P10/P50/P90 64.0/131.0/243.0 days, slow probability 0.16"}, {"record_id": "lesson_chunk:P122007-34335229-0075", "text": "Implementation Completion and Results Report / IV. BANK PERFORMANCE, COMPLIANCE ISSUES, AND RISK TO DEVELOPMENT OUTCOME > Social Compliance |  | Fiduciary compliance 72. The Project faced procurement compliance problems in several instances. Initial delays under Component 1 were mainly due to a failed bidding process for the civil works, but there were also delays after the abandonment of the orig"}, {"record_id": "lesson_chunk:P145529-34182967-0074", "text": "Implementation Completion and Results Report / II. KEY FACTORS THAT AFFECTED IMPLEMENTATION AND OUTCOME > B. KEY FACTORS DURING IMPLEMENTATION |  | 58. The Project suffered from payment delays that affected contractors, but several actions were taken to address this problem. Delays in payment were due to: (i) several instances of postponed commissioning (when, for example, the delayed finalization"}, {"record_id": "lesson_chunk:P151449-34305159-0090", "text": "Implementation Completion and Results Report / IV. BANK PERFORMANCE, COMPLIANCE ISSUES, AND RISK TO DEVELOPMENT OUTCOME > Fiduciary |  | 100. Procurement was a challenge throughout Project implementation, but the PCU was able to overcome difficulties in contractor performance and lengthy lead times for key procurements. Turnover of procurement personnel in the PCU had to be managed. The departure "}, {"record_id": "lesson_chunk:P151832-33952864-0065", "text": "Implementation Completion and Results Report / III. KEY FACTORS THAT AFFECTED IMPLEMENTATION AND OUTCOME > Factors Subject to World Bank Control |  | 56. Proactive guidance from the task team and appropriate adaptation to changing conditions contributed to limit implementation delays. As a transitional measure to address the low responsiveness of the coordinator and pending the recruitment of a re"}, {"record_id": "lesson_chunk:P158982-34302327-0087", "text": "Implementation Completion and Results Report / V. LESSONS AND RECOMMENDATIONS |  | 71. Reliance on specialized partners was key to attenuating a low-capacity implementation environment given the complexity of the Project’s governance and activities. The multisector nature of the Project meant several government entities were involved of implementing arrangements, which could have"}], "actual": "signed 2025-01-23, 216 days from notice to signing (slow for its peer group: yes); model A range P10-P90 78-287 days, P50 166"}, {"id": "r21", "country": "LA", "category": "CS", "method": "Quality And Cost-Based Selection", "notice_date": "2023-11-20", "description": "Refurbishment,  Pakpasak TC", "brief": "Package: This package covers the refurbishment of Pakpasak TC in Laos using Quality and Cost-Based Selection for Consulting Services.\nStatus: partial\n\nTimeline: The timeline forecast relies on assumptions regarding the notice type, advertising period, notice length, and language, while the peer group benchmark is drawn from the East Asia and Pacific region. [forecast:5b157d1a8780, benchmark:region_method_category-364cd51d]\n  model forecast for this package: median 370 days from tender notice to signing (P10 187, P90 621); probability of a slow tender 21% [forecast:5b157d1a8780]\n  peer group: median 344 days; 90th percentile 629 days [benchmark:region_method_category-364cd51d]\n  the forecast median is 26 days longer than the peer-group median\n\nMarket approach: Proceed with Quality and Cost-Based Selection as the planned method, consistent with the peer group benchmark for this category and method in the East Asia and Pacific region. [benchmark:region_method_category-364cd51d]\n\nRisks and mitigations:\n  1. Delays in contract implementation may occur if contracts are awarded during the rainy season or late in the dry season, leading to periods of non-activity. -> Ensure time sequencing of implementation aligns with dry seasons to avoid half-year delays in contract execution. [lesson_chunk:P123828-34118211-0110]\n  2. Procurement delays can arise from pauses in prequalification or impasses regarding the participation of state-owned enterprises. -> Resolve procurement strategy and participation issues early with high-level involvement to prevent delays in bidding document publication. [lesson_chunk:P149697-33955100-0078]\n  3. Contractors may fail to meet compressed timelines if detailed design specifications and drawings are initiated late in the process. -> Initiate detailed design specifications, BOQ, and drawings well in advance to avoid compressing construction timelines. [lesson_chunk:P145502-33841581-0053]\n  4. Payment delays due to postponed commissioning or lengthy technical reviews of invoices can negatively affect contractors. -> Reinforce coordination to reduce invoice processing times and avoid retaining contract guarantees until all systems are tested. [lesson_chunk:P145529-34182967-0074]\n\nSimilar precedents:\n  none (no close precedent found)\n\nEvidence gaps:\n  - no close precedent found", "cited": [{"record_id": "benchmark:region_method_category-364cd51d", "text": "tender notice to signing, peer group: East Asia and Pacific, Quality And Cost-Based Selection, CS | P10/P50/P90 113.0/344.0/629.0 days, n=186"}, {"record_id": "forecast:5b157d1a8780", "text": "model forecast of tender notice to signing for this package (P10-P90 is an 80% interval) | model P10/P50/P90 187.0/370.0/621.0 days, slow probability 0.21"}, {"record_id": "lesson_chunk:P123828-34118211-0110", "text": "Implementation Completion and Results Report / ANNEX 5. BORROWER, CO-FINANCIER AND OTHER PARTNER/STAKEHOLDER COMMENTS > Lessons Learned |  | Importance of time sequencing of Implementation. On many occasions LGED awarded civil works contracts at the beginning of rainy season or late in the dry season, resulting in non-activity of contractors due to this half of the year pass without work that dela"}, {"record_id": "lesson_chunk:P145502-33841581-0053", "text": "Implementation Completion and Results Report / III. KEY FACTORS THAT AFFECTED IMPLEMENTATION AND OUTCOME > B. KEY FACTORS DURING IMPLEMENTATION |  | Two TPs that had been contracted in August 2016 were also cancelled due to non-compliance of the contractual requirements by the contracted company. In addition, there were delays in shortlisting for the CNM contracts. The five CNM packages were recon"}, {"record_id": "lesson_chunk:P145529-34182967-0074", "text": "Implementation Completion and Results Report / II. KEY FACTORS THAT AFFECTED IMPLEMENTATION AND OUTCOME > B. KEY FACTORS DURING IMPLEMENTATION |  | 58. The Project suffered from payment delays that affected contractors, but several actions were taken to address this problem. Delays in payment were due to: (i) several instances of postponed commissioning (when, for example, the delayed finalization"}, {"record_id": "lesson_chunk:P149697-33955100-0078", "text": "Implementation Completion and Results Report / IV. BANK PERFORMANCE, COMPLIANCE ISSUES, AND RISK TO DEVELOPMENT OUTCOME > Procurement |  | 94. A Procurement Capacity and Risk Assessment conducted during project preparation identified that the greatest risks were delays to large works contracts and cost overruns due to claims and variations. However, 35 World Bank Aide-Memoire for the Implementatio"}], "actual": "signed 2026-04-06, 868 days from notice to signing (slow for its peer group: yes); model A range P10-P90 104-456 days, P50 202"}, {"id": "r22", "country": "", "category": "CW", "method": "Request for Bids", "notice_date": "2023-09-05", "description": "River training works in Novi Pazar for rivers Raska, Josanica and Trnavica", "brief": "Package: This package covers river training works for the Raska, Josanica, and Trnavica rivers in Novi Pazar under the Request for Bids method.\nStatus: complete\n\nTimeline: The timeline forecast assumes an Invitation for Bids notice type, a 28-day advertising period, a 7862-character notice length, and English language, though it does not account for specific local regulatory delays. [forecast:0fa63d37639e, benchmark:region_method_category-ca702e52]\n  model forecast for this package: median 137 days from tender notice to signing (P10 76, P90 233); probability of a slow tender 17% [forecast:0fa63d37639e]\n  peer group: median 110 days; 90th percentile 251 days [benchmark:region_method_category-ca702e52]\n  the forecast median is 27 days longer than the peer-group median\n\nMarket approach: Proceed with Request for Bids as the method, consistent with the planned notice and precedents, while considering the peer group median of 110 days for similar contracts in Europe and Central Asia. [contract:1662293, contract:1614656, benchmark:region_method_category-ca702e52]\n\nRisks and mitigations:\n  1. Delays in contract signing after the Bank's no-objection may occur due to capacity constraints or inconsistent adherence to procurement guidelines. -> Provide proactive guidance and training on procurement and contract management to the implementing agency to ensure timely compliance. [lesson_chunk:P119085-34027767-0081]\n  2. Shortages or turnover of procurement staff and low quality bidding documents can lead to multiple re-bidding rounds and significant delays. -> Ensure adequate staffing levels and conduct bidder conferences and training to improve document quality and local vendor capacity. [lesson_chunk:P132173-32872360-0069]\n  3. Lack of follow-up by the Project Implementation Unit (PIU) and delays in submitting Terms of Reference to the Bank can slow the contracting process. -> Establish a clear schedule for TOR submission and implement regular follow-up mechanisms to monitor progress and address bottlenecks. [lesson_chunk:P151832-33952864-0074]\n\nSimilar precedents:\n  - contract:1662293 Restoration of River Training Works along Khangarh Flood Bund: Restoration of River Training Works using Request for Bids for a similar civil works category.\n  - contract:1614656 Raising and Strengthening of River Training Works along Left Marginal Bund (LMB) at Upstream and Colony Protection Bund at Downstream of Marala Barrage: Raising and Strengthening of River Training Works using Request for Bids for a similar civil works category.", "cited": [{"record_id": "benchmark:region_method_category-ca702e52", "text": "tender notice to signing, peer group: Europe and Central Asia, Request for Bids, CW | P10/P50/P90 57.0/110.0/251.0 days, n=497"}, {"record_id": "contract:1614656", "text": "Raising and Strengthening of River Training Works along Left Marginal Bund (LMB) at Upstream and Colony Protection Bund at Downstream of Marala Barrage | PK, Request for Bids, signed 2020-06-04, 132 days, winner SE-329492 AL-ARAB ASSOCIATE"}, {"record_id": "contract:1662293", "text": "Restoration of River Training Works along Khangarh Flood Bund | PK, Request for Bids, signed 2021-07-15, 100 days, winner SE-1012089 MUHAMMAD RAMZAN & CO"}, {"record_id": "forecast:0fa63d37639e", "text": "model forecast of tender notice to signing for this package (P10-P90 is an 80% interval) | model P10/P50/P90 76.0/137.0/233.0 days, slow probability 0.17"}, {"record_id": "lesson_chunk:P119085-34027767-0081", "text": "Implementation Completion and Results Report / IV. BANK PERFORMANCE, COMPLIANCE ISSUES, AND RISK TO DEVELOPMENT OUTCOME > M&E Implementation |  | Delays during investment preparation were driven by lack of adequate staffing and capacity, low exposure of States and the market to novel features of the NGRBP Investment Framework, and EA’s following their own procurement policies, which SPMGs lacked t"}, {"record_id": "lesson_chunk:P132173-32872360-0069", "text": "Implementation Completion and Results Report / IV. BANK PERFORMANCE, COMPLIANCE ISSUES, AND RISK TO DEVELOPMENT OUTCOME > Procurement |  | 82. Procurement was rated in the Satisfactory range by the World Bank until a downgrade to “Moderately Unsatisfactory” in late 2019, primarily due to poor procurement practices in Bihar. Despite positive ratings for most of the project period, procurement delay"}, {"record_id": "lesson_chunk:P151832-33952864-0074", "text": "Implementation Completion and Results Report / IV. BANK PERFORMANCE, COMPLIANCE ISSUES, AND RISK TO DEVELOPMENT OUTCOME > B. ENVIRONMENTAL, SOCIAL, AND FIDUCIAR |  | 70. Financial Management (FM) and Procurement were rated MS for most of the project, except for an MU rating for procurement in the second project ISR 45. During implementation, shortcomings in procurement included delays in the contr"}], "actual": "signed 2023-12-29, 115 days from notice to signing (slow for its peer group: no); model A range P10-P90 106-356 days, P50 198"}, {"id": "r23", "country": "DJ", "category": "CS", "method": "Least Cost Selection", "notice_date": "2024-02-13", "description": "Recrutement d'un cabinet d'audit pour la vérification des exercices 2023, 2024 et 2025.", "brief": "Package: The package covers the recruitment of an audit firm to verify fiscal years 2023, 2024, and 2025 in Djibouti using Least Cost Selection.\nStatus: partial\n\nTimeline: The timeline forecast assumes a Request for Expression of Interest notice type, a 15-day advertising period, a 6267-character notice length, and French language, but does not account for specific project readiness factors. [forecast:bd2bffff7976, benchmark:region_method_category-6ba68016]\n  model forecast for this package: median 194 days from tender notice to signing (P10 101, P90 322); probability of a slow tender 17% [forecast:bd2bffff7976]\n  peer group: median 211 days; 90th percentile 309 days [benchmark:region_method_category-6ba68016]\n  the forecast median is 17 days shorter than the peer-group median\n\nMarket approach: Proceed with Least Cost Selection for Consulting Services as this method aligns with the planned notice and regional precedents for similar assignments. [benchmark:region_method_category-6ba68016, benchmark:method_category-cda80202]\n\nRisks and mitigations:\n  1. Delays in the procurement process for hiring auditors may occur if the short list is deemed unacceptable, requiring the selection process to restart. -> Ensure the short list criteria are strictly aligned with World Bank terms of reference and reviewed early to avoid rejection. [lesson_chunk:P122402-33750496-0080]\n  2. Delays in submitting interim unaudited financial reports or annual audit reports can lead to the discontinuation of disbursements. -> Implement strict internal deadlines for report submission and secure advance withdrawal mechanisms to maintain cash flow during delays. [lesson_chunk:P105311-32445102-0076]\n  3. External audit reports may be delayed due to government auditor bottlenecks, which are often beyond the project's direct control. -> Engage with the Supreme Audit Office early to align on timelines and establish a dedicated liaison to track report progress. [lesson_chunk:P125961-33437845-0063, lesson_chunk:P161348-33672555-0067]\n\nSimilar precedents:\n  none (no close precedent found)\n\nEvidence gaps:\n  - no close precedent found", "cited": [{"record_id": "benchmark:method_category-cda80202", "text": "tender notice to signing, peer group: all regions, Least Cost Selection, CS | P10/P50/P90 80.0/200.0/403.0 days, n=339"}, {"record_id": "benchmark:region_method_category-6ba68016", "text": "tender notice to signing, peer group: Middle East, North Africa, Afghanistan, and Pakistan, Least Cost Selection, CS | P10/P50/P90 116.0/211.0/309.0 days, n=31"}, {"record_id": "forecast:bd2bffff7976", "text": "model forecast of tender notice to signing for this package (P10-P90 is an 80% interval) | model P10/P50/P90 101.0/194.0/322.0 days, slow probability 0.17"}, {"record_id": "lesson_chunk:P105311-32445102-0076", "text": "Implementation Completion and Results Report / IV. BANK PERFORMANCE, COMPLIANCE ISSUES, AND RISK TO DEVELOPMENT OUTCOME > B. ENVIRONMENTAL, SOCIAL, AND FIDUCIAR |  | Bank to reflect implementation. Procurement efficiency improved as the project team gained experience. Procurement policies were satisfactorily complied with. 74. Financial management. From the start, the FM arrangements were mainstre"}, {"record_id": "lesson_chunk:P122402-33750496-0080", "text": "Implementation Completion and Results Report / IV. BANK PERFORMANCE, COMPLIANCE ISSUES, AND RISK TO DEVELOPMENT OUTCOME > Fiduciary Compliance |  | 83. Disbursement reached approximately 70 percent in the first year of implementation, reflecting the ACE fee payment and in line with the project designs. The remaining funds mainly financed activities under Component 2 and delays mostly related to pr"}, {"record_id": "lesson_chunk:P125961-33437845-0063", "text": "Implementation Completion and Results Report / IV. BANK PERFORMANCE, COMPLIANCE ISSUES, AND RISK TO DEVELOPMENT OUTCOME > Financial Management |  | 74. The project maintained adequate FM arrangements, and the FM rating remained Moderately Satisfactory or above, except in one ISR when it was rated Moderately Unsatisfactory because of an unaddressed audit issue. The project submitted interim unaudit"}, {"record_id": "lesson_chunk:P161348-33672555-0067", "text": "Implementation Completion and Results Report / ENVIRONMENTAL, SOCIAL, AND FIDUCIARY COMPLIANCE > Financial Management |  | 61. The financial management of the project is rated as Moderately Unsatisfactory. The FM performance rating ranged from Moderately Satisfactory to Moderately Unsatisfactory while the FM risk rating was remained Substantial during the three years life of the project. The proje"}], "actual": "signed 2024-07-24, 162 days from notice to signing (slow for its peer group: no); model A range P10-P90 90-316 days, P50 172"}, {"id": "r24", "country": "BD", "category": "NC", "method": "Request for Bids", "notice_date": "2024-01-24", "description": "Rental Vehicles for RMSUs", "brief": "Package: This package covers the rental of vehicles for Rural Management Support Units in Bangladesh using the Request for Bids method under the National Competitive category.\nStatus: complete\n\nTimeline: The timeline forecast assumes an Invitation for Bids notice type, a 27-day advertising period, a 6103-character notice length, and English language, but does not account for specific project constraints. [forecast:dc3000d489ea, benchmark:region_method_category-02ab1a91]\n  model forecast for this package: median 150 days from tender notice to signing (P10 69, P90 344); probability of a slow tender 27% [forecast:dc3000d489ea]\n  peer group: median 133 days; 90th percentile 326 days [benchmark:region_method_category-02ab1a91]\n  the forecast median is 17 days longer than the peer-group median\n\nMarket approach: Proceed with Request for Bids as the method, consistent with the single precedent found for vehicle rental services in Bangladesh and the regional benchmark for NC category tenders. [contract:1767488, benchmark:region_method_category-02ab1a91]\n\nRisks and mitigations:\n  1. Delays in contract implementation may occur if procurement is not completed early enough to avoid the rainy season. -> Ensure early procurement of contract packages and advance recruitment of consultant services to prepare tender documents before the rainy season begins. [lesson_chunk:P123828-34118211-0110]\n  2. Contractors may fail to complete work or follow the time schedule without adequate penalties. -> Establish minimum criteria for contractor selection, maintain a performance database, and enforce blacklisting and penalties for defaulting contractors. [lesson_chunk:P123828-34118211-0115]\n\nSimilar precedents:\n  - contract:1767488 Vehicle Rental Service [NS-01(A)]: This is a vehicle rental service contract in Bangladesh awarded via Request for Bids.", "cited": [{"record_id": "benchmark:region_method_category-02ab1a91", "text": "tender notice to signing, peer group: South Asia, Request for Bids, NC | P10/P50/P90 43.0/133.0/326.0 days, n=53"}, {"record_id": "contract:1767488", "text": "Vehicle Rental Service [NS-01(A)] | BD, Request for Bids, signed 2023-10-31, 44 days, winner SE-1079689 FENI RENT-A-CAR"}, {"record_id": "forecast:dc3000d489ea", "text": "model forecast of tender notice to signing for this package (P10-P90 is an 80% interval) | model P10/P50/P90 69.0/150.0/344.0 days, slow probability 0.27"}, {"record_id": "lesson_chunk:P123828-34118211-0110", "text": "Implementation Completion and Results Report / ANNEX 5. BORROWER, CO-FINANCIER AND OTHER PARTNER/STAKEHOLDER COMMENTS > Lessons Learned |  | Importance of time sequencing of Implementation. On many occasions LGED awarded civil works contracts at the beginning of rainy season or late in the dry season, resulting in non-activity of contractors due to this half of the year pass without work that dela"}, {"record_id": "lesson_chunk:P123828-34118211-0115", "text": "Implementation Completion and Results Report / ANNEX 5. BORROWER, CO-FINANCIER AND OTHER PARTNER/STAKEHOLDER COMMENTS > Drawback in Design |  | In LGED context, when piloting period is over, it again became unattended, continuous routine maintenance was not resumed by LGED, so the effort of piloting went in vain. PBMC was not continued or PBMC was not replicated in other RRs. We make an overview o"}], "actual": "signed 2024-06-27, 155 days from notice to signing (slow for its peer group: no); model A range P10-P90 29-373 days, P50 151"}, {"id": "r25", "country": "RS", "category": "NC", "method": "Request for Proposals", "notice_date": "2024-10-01", "description": "Supply, Installation and Implementation of Commercial-off-the-shelf (COTS) ICT System with Integration and Migration of Data", "brief": "Package: The package covers the supply, installation, and implementation of a commercial-off-the-shelf ICT system with data integration and migration in Serbia.\nStatus: partial\n\nTimeline: The timeline forecast relies on assumptions regarding notice type, advertising period, notice length, and language, while the peer group benchmark is based on the category level due to insufficient data at the method or region levels. [forecast:0d7a67d4e8da, benchmark:category-05e384c9]\n  model forecast for this package: median 233 days from tender notice to signing (P10 121, P90 443); probability of a slow tender 19% [forecast:0d7a67d4e8da]\n  peer group: median 133 days; 90th percentile 330 days [benchmark:category-05e384c9]\n  the forecast median is 100 days longer than the peer-group median\n\nMarket approach: Proceed with Request for Proposals as the procurement method, informed by the category benchmark which shows a median duration of 133 days for NC contracts, while noting that specific method-level benchmarks are unavailable due to low sample sizes. [benchmark:category-05e384c9, benchmark:method_category-fd733183, benchmark:region_method_category-1c85d987]\n\nRisks and mitigations:\n  1. Legacy data quality may be insufficient for effective migration to the new system, potentially increasing costs for data recollection. -> Conduct a thorough data quality assessment and feasibility study for digitizing legacy records prior to finalizing system specifications. [document_chunk:P175987_33191006_0128]\n  2. Rapid technology development and changing regulations may render pre-defined large ICT packages obsolete before implementation. -> Adopt an adaptive management approach that prioritizes systems integration and allows for postponing or revising procurement packages if integration solutions are not ready. [lesson_chunk:P127676-34365428-0086]\n  3. Lack of experience and inadequate capacity in the implementing agency regarding complex ICT procurement can lead to poor internal processes and delays. -> Ensure upfront work during preparation includes clarity on implementation arrangements, market assessments, and early finalization of clearances. [lesson_chunk:P145502-33841581-0067]\n  4. Delays in budget approvals and the composition of working groups can significantly postpone contract signing and tender announcements. -> Secure early approvals for annual project budgets and implementation plans, and finalize the composition of working groups and selection committees before project start. [lesson_chunk:P092429-33863468-0073]\n\nSimilar precedents:\n  none (no close precedent found)\n\nEvidence gaps:\n  - No close precedent found for this specific package.\n  - Method-level and region-method-level benchmarks are based on too few contracts to be reliable.", "cited": [{"record_id": "benchmark:category-05e384c9", "text": "tender notice to signing, peer group: all regions and methods, NC | P10/P50/P90 52.0/133.0/330.0 days, n=652"}, {"record_id": "benchmark:method_category-fd733183", "text": "tender notice to signing, peer group: all regions, Request for Proposals, NC | P10/P50/P90 66.0/209.0/721.0 days, n=13"}, {"record_id": "benchmark:region_method_category-1c85d987", "text": "tender notice to signing, peer group: Europe and Central Asia, Request for Proposals, NC | P10/P50/P90 189.0/189.0/189.0 days, n=1"}, {"record_id": "document_chunk:P175987_33191006_0128", "text": "Project Appraisal Document / VI. KEY RISKS |  | Concerning legal ID, there are risks that legacy data that may be migrated in the new legal ID systems – including the IBOGA voter ID registry and the paper-based CR system – will not be of sufficient quality or standard to migrate effectively to new systems, which could increase cost associated wit"}, {"record_id": "forecast:0d7a67d4e8da", "text": "model forecast of tender notice to signing for this package (P10-P90 is an 80% interval) | model P10/P50/P90 121.0/233.0/443.0 days, slow probability 0.19"}, {"record_id": "lesson_chunk:P092429-33863468-0073", "text": "Implementation Completion and Results Report / III. KEY FACTORS THAT AFFECTED IMPLEMENTATION AND OUTCOME > B. KEY FACTORS DURING IMPLEMENTATION |  | 88. Factors under GOR control: - Delayed approvals of annual project budgets, implementation and procurement plans by the MOF at early years of project implementation further delayed the contracts signing. - Protracted mutual acceptance of the procure"}, {"record_id": "lesson_chunk:P127676-34365428-0086", "text": "Implementation Completion and Results Report / V. LESSONS AND RECOMMENDATIONS |  | 110. An adaptive management approach should be integrated in the procurement of high-value ICT assets, with the systems integration taking precedence over the pre-identified timetables of individual procurement packages. In the procurement of high-value ICT systems (hardware and software), delays ca"}, {"record_id": "lesson_chunk:P145502-33841581-0067", "text": "Implementation Completion and Results Report / V. LESSONS AND RECOMMENDATIONS |  | Lesson: Dilution of readiness criteria during project preparation can adversely impact project implementation. Readiness filters are set keeping in mind the country and institutional context. Accelerated preparation timelines and not meeting the country readiness conditions can set the project up fo"}], "actual": "signed 2025-12-16, 441 days from notice to signing (slow for its peer group: yes); model A range P10-P90 149-510 days, P50 279"}, {"id": "r26", "country": "GY", "category": "GO", "method": "Request for Bids", "notice_date": "2024-06-13", "description": "Supply and Delivery of Furniture and Equipment for the New Faculty of Health Sciences Building, University of Guyana, Turkeyen Campus", "brief": "Package: The package covers the supply and delivery of furniture and equipment for the new Faculty of Health Sciences Building at the University of Guyana, utilizing the Request for Bids method.\nStatus: complete\n\nTimeline: The timeline forecast assumes an Invitation for Bids notice type, a 30-day advertising period, a 5949-character notice length, and English language, but does not account for specific project design complexities or local approval delays. [forecast:26e690e307c9, benchmark:region_method_category-d9457432]\n  model forecast for this package: median 111 days from tender notice to signing (P10 55, P90 225); probability of a slow tender 8% [forecast:26e690e307c9]\n  peer group: median 154 days; 90th percentile 350 days [benchmark:region_method_category-d9457432]\n  the forecast median is 43 days shorter than the peer-group median\n\nMarket approach: Proceed with Request for Bids as planned, consistent with the large peer group benchmark and the single high-value precedent, while noting that smaller similar furniture contracts in the region often utilized Request for Quotations. [benchmark:region_method_category-d9457432, contract:1765796, contract:1638806, contract:1638817, contract:1755857, contract:1741037]\n\nRisks and mitigations:\n  1. Delays may occur due to annual approval cycles for procurement plans or slow decision-making layers similar to those observed in university campus construction projects. -> Establish a dedicated task force or relocate the Project Management Unit to the site to accelerate decision-making and approval processes. [lesson_chunk:P110693-33653499-0094]\n  2. Procurement processes may face delays from supplier complaints regarding award decisions, which can trigger mandatory reviews by oversight bodies. -> Establish a clear protocol for handling bidder complaints and engage early with oversight bodies to clarify policies and expedite decisions. [lesson_chunk:P123146-32187237-0079, lesson_chunk:P123146-32187237-0078]\n  3. Evaluation sessions may be delayed if evaluation commission members are unavailable or fail to respect statutory deadlines for offer assessment. -> Sensitize evaluation commission members to project objectives and strictly enforce procurement deadlines set in the Procurement Plan. [document_chunk:P175982_33841539_0080]\n  4. Delays in contract signing and approval can occur due to administrative bottlenecks or unavailability of key ministry officials. -> Implement a follow-up mechanism for packages sent for approval and report impediments to the Portfolio Coordination at the Ministry of Economy and Finance. [document_chunk:P175982_33841539_0080]\n\nSimilar precedents:\n  - contract:1765796 Supply and delivery of office furniture and equipment for the administration building: Similar supply and delivery of office furniture and equipment using Request for Bids method.\n  - contract:1638806 Supply and delivery of furniture: Supply and delivery of furniture with multiple firms in the award notice.\n  - contract:1638817 Supply and delivery of furniture: Supply and delivery of furniture contract.\n  - contract:1755857 SUPPLY AND DELIVERY OF FURNITURE FOR PROJECT OFFICE: Supply and delivery of furniture for a project office.\n  - contract:1741037 Supply and Delivery of Furniture and Equipment: Supply and delivery of furniture and equipment.", "cited": [{"record_id": "benchmark:region_method_category-d9457432", "text": "tender notice to signing, peer group: Latin America and Caribbean, Request for Bids, GO | P10/P50/P90 73.0/154.0/350.0 days, n=410"}, {"record_id": "contract:1638806", "text": "Supply and delivery of furniture | KE, Request for Quotations, signed 2020-04-03, None days, winner SE-342648 FAST CHOICE LTD"}, {"record_id": "contract:1638817", "text": "Supply and delivery of furniture | KE, Request for Quotations, signed 2020-04-03, None days, winner SE-537682 PANESAR KENYA LTD"}, {"record_id": "contract:1741037", "text": "Supply and Delivery of Furniture and Equipment | MW, Request for Quotations, signed 2022-08-09, None days, winner SE-447359 ELITE FURNITURE & INTERIORS LIMITED"}, {"record_id": "contract:1755857", "text": "SUPPLY AND DELIVERY OF FURNITURE FOR PROJECT OFFICE | 3W, Request for Quotations, signed 2022-02-03, None days, winner SE-749041 PRECMART SOLUTIONS"}, {"record_id": "contract:1765796", "text": "Supply and delivery of office furniture and equipment for the administration buil ment was strong, the large number of complex procurement processes, were the main reason for delays in project execution. There were many compl"}], "actual": "signed 2024-07-31, 48 days from notice to signing (slow for its peer group: no); model A range P10-P90 10-199 days, P50 77"}, {"id": "r27", "country": "TJ", "category": "CS", "method": "Least Cost Selection", "notice_date": "2023-08-09", "description": "OJSC Barqi Tojik, project and program audits for FY2023-2025", "brief": "Package: This package covers project and program audits for OJSC Barqi Tojik for FY2023-2025 using Least Cost Selection.\nStatus: partial\n\nTimeline: The timeline forecast relies on assumptions regarding a Request for Expression of Interest notice type, a 15-day advertising period, a 6267-character notice length, and English language, which do not account for specific local regulatory approval steps. [forecast:5cf7c178ef6a, benchmark:region_method_category-58a5cc8a]\n  model forecast for this package: median 166 days from tender notice to signing (P10 74, P90 369); probability of a slow tender 12% [forecast:5cf7c178ef6a]\n  peer group: median 120 days; 90th percentile 218 days [benchmark:region_method_category-58a5cc8a]\n  the forecast median is 46 days longer than the peer-group median\n\nMarket approach: Proceed with Least Cost Selection as the method, informed by the regional benchmark for Europe and Central Asia which shows a median duration of 120 days for this method and category. [benchmark:region_method_category-58a5cc8a]\n\nRisks and mitigations:\n  1. Procurement delays may occur due to staff shortages, high turnover, or low capacity of the Project Management Unit. -> Implement capacity building measures such as training and bidder conferences to strengthen the PMU and local agencies. [lesson_chunk:P132173-32872360-0069]\n  2. Internal approval processes within the utility or government may cause delays even after external clearances are obtained. -> Establish clear coordination protocols and streamline internal sign-off procedures to prevent bottlenecks. [lesson_chunk:P123513-33654948-0093]\n  3. Frequent changes in top leadership or management vision can alter the scope and relevance of audit studies during implementation. -> Ensure close supervision and adapt the scope of studies to remain relevant to the current management's strategic vision. [lesson_chunk:P117293-33217084-0061]\n  4. Delays in submitting interim unaudited financial reports or annual audit reports may lead to disbursement stoppages. -> Mainstream financial management into existing accounting systems and provide consistent implementation support to ensure timely reporting. [lesson_chunk:P105311-32445102-0076]\n\nSimilar precedents:\n  none (no close precedent found)\n\nEvidence gaps:\n  - No close precedent found for this specific audit package in the records.", "cited": [{"record_id": "benchmark:region_method_category-58a5cc8a", "text": "tender notice to signing, peer group: Europe and Central Asia, Least Cost Selection, CS | P10/P50/P90 45.0/120.0/218.0 days, n=50"}, {"record_id": "forecast:5cf7c178ef6a", "text": "model forecast of tender notice to signing for this package (P10-P90 is an 80% interval) | model P10/P50/P90 74.0/166.0/369.0 days, slow probability 0.12"}, {"record_id": "lesson_chunk:P105311-32445102-0076", "text": "Implementation Completion and Results Report / IV. BANK PERFORMANCE, COMPLIANCE ISSUES, AND RISK TO DEVELOPMENT OUTCOME > B. ENVIRONMENTAL, SOCIAL, AND FIDUCIAR |  | Bank to reflect implementation. Procurement efficiency improved as the project team gained experience. Procurement policies were satisfactorily complied with. 74. Financial management. From the start, the FM arrangements were mainstre"}, {"record_id": "lesson_chunk:P117293-33217084-0061", "text": "Implementation Completion and Results Report / III. KEY FACTORS THAT AFFECTED IMPLEMENTATION AND OUTCOME > B. KEY FACTORS DURING IMPLEMENTATION |  | 52. Adaptability in a changing institutional landscape. Over the course of implementation, SEDAPAL had eight general managers (six of whom were acting) as well as numerous changes to its Board of Directors (seven presidents over the last ten years). T"}, {"record_id": "lesson_chunk:P123513-33654948-0093", "text": "Implementation Completion and Results Report / IV. BANK PERFORMANCE, COMPLIANCE ISSUES, AND RISK TO DEVELOPMENT OUTCOMES > Procurement |  | 87. Procurement was done by the FMWR, through its FPIU, for Components 2 and 3, and by the SPIUs for Component 1. FMWR had experience with Bank procurement, but Bauchi and Ekiti did not. As stated in section III.A, due to lack of investment readiness, the proj"}, {"record_id": "lesson_chunk:P132173-32872360-0069", "text": "Implementation Completion and Results Report / IV. BANK PERFORMANCE, COMPLIANCE ISSUES, AND RISK TO DEVELOPMENT OUTCOME > Procurement |  | 82. Procurement was rated in the Satisfactory range by the World Bank until a downgrade to “Moderately Unsatisfactory” in late 2019, primarily due to poor procurement practices in Bihar. Despite positive ratings for most of the project period, procurement delay"}], "actual": "signed 2023-12-11, 124 days from notice to signing (slow for its peer group: no); model A range P10-P90 52-354 days, P50 145"}, {"id": "r28", "country": "GT", "category": "CW", "method": "Request for Bids", "notice_date": "2023-08-07", "description": "Construcción de Puestos de Salud en los Departamentos de Quiché y Huehuetenango, -Grupo 5-", "brief": "Package: The package involves the construction of health posts in Quiché and Huehuetenango, Guatemala, using the Request for Bids method for civil works.\nStatus: complete\n\nTimeline: The timeline forecast relies on assumptions regarding the notice type, advertising period, notice length, and language, while the peer group benchmark is selected based on region, method, and category. [forecast:b9943c7de768, benchmark:region_method_category-ae20c349]\n  model forecast for this packa acilities.\n  - contract:1724536 New construction (01) Health station in Long Trach commune, Can Duoc district: New construction of a health station using Request for Bids method.\n  - contract:1655903 COM-HSP-01 Construction of Health Facility: Construction of a health facility with similar civil works category.\n  - contract:1655892 CAB-HSP-01 Construction of Health Facility: Construction of a health facility with similar civil works category.\n  - contract:1655738 CRA-HSP-01 Construction of Health Facility: Construction of a health facility with similar civil works category.", "cited": [{"record_id": "benchmark:region_method_category-ae20c349", "text": "tender notice to signing, peer group: Latin America and Caribbean, Request for Bids, CW | P10/P50/P90 44.0/139.0/356.0 days, n=203"}, {"record_id": "contract:1608656", "text": "Construction of Health Posts (3 rooms, fense 400m, gate 1, well1, WC 2rooms, pipe culvert 1, incinerator 1, 200m of laterite road). 1 Unit for Daung. | KH, Request for Quotations, signed 2019-11-14, None days, winner SE-387801 KHMER APHIVATH"}, {"record_id": "contract:1655738", "text": "CRA-HSP-01 Construction of Health Facility | PH, Request for Quotations, signed 2021-01-19, None days, winner SE-411451 ANGKAT CONTRUCTION AND SUPPLIES"}, {"record_id": "contract:1655892", "text": "CAB-HSP-01 Construction of Health Facility | PH, Request for Quotations, signed 2021-01-19, None days, winner SE-411842 RNS CONSTRUCTION ENGINEERING"}, {"record_id": "contract:1655903", "text": "COM-HSP-01 Construction of Health Facility | PH, Request for Quotations, signed 2021-01-19, None days, winner SE-412327 JJHAK CONSTRUCTION"}, {"record_id": "contract:1724536", "text": "New construction (01) Health station in Long Trach commune, Can Duoc district | VN, Request for Bids, signed 2022-12-09, None days, winner SE-739187 CONSTRUCTION DESIGN AND ADVERTISING CONSULTANT JOINT STOCK COMPANY CONG TAM REPORT"}, {"record_id": "forecast:b9943c7de768", "text": "model for
