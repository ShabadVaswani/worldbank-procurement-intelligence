s for Procurement Plans early in the process to restore performance. [lesson_chunk:P125565-34219519-0070]\n  2. Contractor issues such as shortages of materials, working capital shortfalls, and poor planning can lead to significant delays in activity delivery. -> Include strong efficiency incentives in payment schedules and monitor contract activities rigorously to address financial and planning issues early. [lesson_chunk:P125565-34219519-0071, lesson_chunk:P147277-34073027-0073]\n  3. Payment delays caused by lengthy technical reviews and retention of guarantees until full commissioning can demobilize contractors and stall works. -> Streamline invoice processing times and agree to release contract guarantees progressively upon completion of specific works rather than waiting for full system testing. [lesson_chunk:P145529-34182967-0074]\n\nSimilar precedents:\n  - contract:1754608 Recrutement d’un Ingénieur Conseil assistant le Maitre d’ouvrage pour l’étude, l’élaboration du dossier d’appel d’offres, la supervision et le suivi de réalisat: Recruitment of an engineering firm for supervision and follow-up of realization in a similar context, though in a different country.\n  - contract:1711519 Supervision des travaux des réseaux de distribution du financement additionnel: Supervision of distribution network works in Niger using the same selection method.\n  - contract:1656065 Recrutement d'une firme (Consultant) pour réaliser une enquête sur la capacité et la volonté à payer des potentiels clients des mini-réseaux.: Recruitment of a consultant for mini-grid related activities, specifically assessing client capacity and willingness to pay.\n  - contract:1702498 Assistance technique pour la fourniture d'électricité de façon durable à des infrastructures de santé par les opérateurs de mini-réseaux: Technical assistance for sustainable electricity supply to health infrastructure via mini-grid operators.", "cited": [{"record_id": "benchmark:country_method_category-b8737a6 25565-34219519-0071", "text": "Implementation Completion and Results Report / III. KEY FACTORS THAT AFFECTED IMPLEMENTATION AND OUTCOME > B. KEY FACTORS DURING IMPLEMENTATION |  | 57. Contractor issues. There were various contractor issues, including a shortage of materials, shortfalls in working capital, and low human resources affecting their ability to deliver on the activities in a timely manner and recoup time lost due to "}, {"record_id": "lesson_chunk:P145529-34182967-0074", "text": "Implementation Completion and Results Report / II. KEY FACTORS THAT AFFECTED IMPLEMENTATION AND OUTCOME > B. KEY FACTORS DURING IMPLEMENTATION |  | 58. The Project suffered from payment delays that affected contractors, but several actions were taken to address this problem. Delays in payment were due to: (i) several instances of postponed commissioning (when, for example, the delayed finalization"}, {"record_id": "lesson_chunk:P147277-34073027-0073", "text": "Implementation Completion and Results Report / V. LESSONS AND RECOMMENDATIONS |  | 80. Managing a large number of simultaneous contracts within a single project requires effective monitoring practices and tools comprising the following: a. An adequate institutional arrangement – staff capacity, adequate IT, and quick access to information b. An effective monitoring of contracts to"}], "actual": "signed 2026-01-22, 717 days from notice to signing (slow for its peer group: yes); model A range P10-P90 192-787 days, P50 514"}, {"id": "r02", "country": "PK", "category": "NC", "method": "Request for Bids", "notice_date": "2024-03-15", "description": "Training / skill development of female beneficiaries in four (04) districts (Sherani, Zhob, Kila Saifullah & Pashin) of Balochistan (Package # 1)", "brief": "Package: This package covers training and skill development for female beneficiaries in four districts of Balochistan, Pakistan, using the Request for Bids method.\nStatus: partial\n\nTimeline: The timeline forecast assumes an Invitation for Bids notice type, a 27-day advertising period, a 6103-character notice length, and English language, but does not account for specific project implementation constraints. [forecast:aedf24f7c4d2, benchmark:country_method_category-b7e56efe]\n  model forecast for this package: median 92 days from tender notice to signing (P10 50, P90 177); probability of a slow tender 8% [forecast:aedf24f7c4d2]\n  peer group: median 114 days; 90th percentile 162 days [benchmark:country_method_category-b7e56efe]\n  the forecast median is 22 days shorter than the peer-group median\n\nMarket approach: Proceed with Request for Bids as the procurement method, consistent with the 47 precedents in the Pakistan peer group for this category and method. [benchmark:country_method_category-b7e56efe]\n\nRisks and mitigations:\n  1. Training plans and budgets require prior World Bank review and approval before execution. -> Submit a detailed annual training plan identifying the training, justification, personnel, duration, and estimated cost for review prior to implementation. [document_chunk:P176747_33835356_0140]\n  2. Trainees may fail to demonstrate acquired skills or provide required post-training reports. -> Mandate that trainees prepare and submit a report on the training received upon completion of the program. [document_chunk:P176747_33835356_0140]\n  3. Gender gaps in economic opportunities and decision-making may persist without targeted measures. -> Incorporate specific social mitigation measures and ensure recruitment policies foster equal opportunities for women to participate in project activities. [document_chunk:P160672_31030776_0079, document_chunk:P160672_31030776_0081]\n\nSimilar precedents:\n  none (no close precedent found)\n\nEvidence gaps:\n  - no close precedent found", "cited": [{"record_id": "benchmark:country_method_category-b7e56efe", "text": "tender notice to signing, peer group: PK, Request for Bids, NC | P10/P50/P90 66.0/114.0/162.0 days, n=47"}, {"recor econdary cities in Chad where SNE operates mini-grids.\nStatus: complete\n\nTimeline: The timeline forecast assumes an Invitation for Bids notice type, a 28-day advertising period, a 7862-character notice length, and French language, but does not account for specific project complexity or local market conditions. [forecast:56335b895875, benchmark:region_method_category-31241aaa]\n  model forecast for this package: median 209 days from tender notice to signing (P10 83, P90 327); probability of a slow tender 36% [forecast:56335b895875]\n  peer group: median 150 days; 90th percentile 319 days [benchmark:region_method_category-31241aaa]\n  the forecast median is 59 days longer than the peer-group median\n\nMarket approach: Proceed with Request for Bids for the four lots, leveraging the precedent of 20 firms participating in similar electrical works framework agreements and the regional benchmark for Request for Bids in Civil Works. [contract:1663549, contract:1663550, contract:1663544, contract:1663562, contract:1663521, benchmark:region_method_category-31241aaa]\n\nRisks and mitigations:\n  1. Delays in the contracting process and lack of follow-up by the Project Implementation Unit (PIU) may occur. -> Ensure proactive guidance from the task team and establish a minimum physical progress rate clause with penalties and bonuses to enforce performance. [lesson_chunk:P151832-33952864-0074, lesson_chunk:P151832-33952864-0065]\n  2. Delays in evaluation of offers due to unavailability of the Head of the Procurement Unit or General Directorate of Public Procurement. -> Organize residential evaluation sessions for major markets and strictly comply with procurement deadlines set in the Procurement Plan. [document_chunk:P175982_33841539_0080]\n  3. Implementation delays may arise from the complexity of multi-country or regional infrastructure projects if preparation is not realistic. -> Adopt realistic preparation and implementation schedules to avoid unnecessary delays associated with complex regional approaches. [document_chunk:P167569_33107529_0068]\n  4. Procurement issues such as pausing prequalification or resolving impasses on state-owned enterprise participation can delay bidding document publication. -> Resolve optimum procurement strategy and participation issues early with high-level involvement before publishing bidding documents. [lesson_chunk:P149697-33955100-0078]\n\nSimilar precedents:\n  - contract:1663549 Framework Agreement for Electrical works: Framework Agreement for Electrical works using Request for Bids with 20 firms in the award notice.\n  - contract:1663550 Framework Agreement for Electrical works: Framework Agreement for Electrical works using Request for Bids with 20 firms in the award notice.\n  - contract:1663544 Framework Agreement for Electrical works: Framework Agreement for Electrical works using Request for Bids with 20 firms in the award notice.\n  - contract:1663562 Framework Agreement for Electrical works: Framework Agreement for Electrical works using Request for Bids with 20 firms in the award notice.\n  - contract:1663521 Framework Agreement for Electrical works: Framework Agreement for Electrical works using Request for Bids with 20 firms in the award notice.", "cited": [{"record_id": "benchmark:region_method_category-31241aaa", "text": "tender notice to signing, peer group: Western and Central Africa, Request for Bids, CW | P10/P50/P90 74.0/150.0/319.0 days, n=961"}, {"record_id": "contract:1663521", "text": "Framework Agreement for Electrical works | SZ, Request for Bids, signed 2021-05-12, 175 days, winner SE-552657 BRISASO INVESTMENT"}, {"record_id": "contract:1663544", "text": "Framework Agreement for Electrical works | SZ, Request for Bids, signed 2021-05-12, 175 days, winner SE-552538 BHELE LOLUHLATA INVESTMENT"}, {"record_id": "contract:1663549", "text": "Framework Agreement for Electrical works | SZ, Request for Bids, signed 2021-05-12, 175 days, winner SE-552661 MDUL INVESTMENT"}, {"recor etion and Results Report / III. KEY FACTORS THAT AFFECTED IMPLEMENTATION AND OUTCOME > Factors Subject to World Bank Control |  | 56. Proactive guidance from the task team and appropriate adaptation to changing conditions contributed to limit implementation delays. As a transitional measure to address the low responsiveness of the coordinator and pending the recruitment of a re"}, {"record_id": "lesson_chunk:P151832-33952864-0074", "text": "Implementation Completion and Results Report / IV. BANK PERFORMANCE, COMPLIANCE ISSUES, AND RISK TO DEVELOPMENT OUTCOME > B. ENVIRONMENTAL, SOCIAL, AND FIDUCIAR |  | 70. Financial Management (FM) and Procurement were rated MS for most of the project, except for an MU rating for procurement in the second project ISR 45. During implementation, shortcomings in procurement included delays in the contr"}], "actual": "signed 2024-06-13, 239 days from notice to signing (slow for its peer group: yes); model A range P10-P90 82-339 days, P50 193"}, {"id": "r04", "country": "PK", "category": "CW", "method": "Request for Bids", "notice_date": "2023-12-15", "description": "19 MC Schemes in all districts. (5 Contract Packages).", "brief": "Package: The package covers 19 MC Schemes across all districts in Pakistan, structured into 5 contract packages for civil works using the Request for Bids method.\nStatus: partial\n\nTimeline: The timeline forecast assumes an Invitation for Bids notice type, a 28-day advertising period, a 7862-character notice length, and English language, but does not account for specific project complexity or local regulatory delays. [forecast:93ac32be28b1, benchmark:country_method_category-f6bc337c]\n  model forecast for this package: median 113 days from tender notice to signing (P10 68, P90 287); probability of a slow tender 17% [forecast:93ac32be28b1]\n  peer group: median 103 days; 90th percentile 251 days [benchmark:country_method_category-f6bc337c]\n  the forecast median is 10 days longer than the peer-group median\n\nMarket approach: Proceed with Request for Bids for the 5 contract packages, consistent with the country-specific benchmark for civil works and the planned notice method. [benchmark:country_method_category-f6bc337c]\n\nRisks and mitigations:\n  1. Delays in the contracting process and lack of follow-up by the Project Implementation Unit (PIU) may occur due to insufficient staffing relative to the number of contracts. -> Ensure the PIU is adequately staffed and establish clear follow-up mechanisms for contract monitoring. [lesson_chunk:P151832-33952864-0074]\n  2. Limited experience of the implementing agency in Bank-financed procurement and contracts may lead to delays and poor quality deliverables. -> Appoint a full-time seasoned procurement specialist with relevant experience in MDB-financed projects to the PIU. [document_chunk:P178720_34180517_0077]\n  3. Non-synchronized procurement of the Contractor and the supervising Consultant may result in the Contractor commencing works before the Consultant is in place, compromising quality. -> Coordinate the procurement schedules of the Contractor and the supervising Consultant to ensure the Consultant is in place before works commence. [document_chunk:P171339_32361971_0093]\n  4. Inadequate communication and interaction between beneficiaries and the PIU may cause confusion and delays. -> Develop a procurement section in the Procedure Manuals to clarify roles and organize workshop sessions for training key staff. [document_chunk:P167798_33717698_0188]\n\nSimilar precedents:\n  none (no close precedent found)\n\nEvidence gaps:\n  - no close precedent found", "cited": [{"record_id": "benchmark:country_method_category-f6bc337c", "text": "tender notice to signing, peer group: PK, Request for Bids, CW | P10/P50/P90 71.0/103.0/251.0 days, n=227"}, {"record_id": "document_chunk:P167798_33717698_0188", "text": "Project Appraisal Document / IN BOTH COUNTRIES > C. Procurement |  | All these risks can cause remedial actions by the World Bank; possible delays in evaluation of bids; and technical proposals leading to implementation delays, poor quality of contract deliverables, and reputational risks to the World Bank and the project. 62. The overall procurement risk for the pro"}, {"record_id": "document_chunk:P171339_32361971_0093", "text": "Project Appraisal Document / IV. PROJECT APPRAISAL SUMMARY > B. Fiduciary |  | However, there was no tracking of complaints to establish the trends, issues raised, root causes, and how they are resolved so as to improve future bidding processes. There are also cases of non-synchronized procurement of the Contractor and the supervising Consultant resulting in the Contractor com"}, {"record_id": "document_chunk:P178720_34180517_0077", "text": "Project Appraisal Document / VI. KEY RISKS |  | The MOPT is also planning to create a dedicated PIU for the Project within DPOP. Component 2 of the Project will strengthen the implementation capacity of the PIU and help reduce the risk of institutional capacity constraints. In addition, funding for the operational costs of the PIU is secured unde"}, {"record_id": "forecast:93ac32be28b1", "text": "model forecast of tender notice to signing for this package (P10-P90 is an 80% interval) | model P10/P50/P90 68.0/113.0/287.0 days, slow probability 0.17"}, {"record_id": "lesson_chunk:P151832-33952864-0074", "text": "Implementation Completion and Results Report / IV. BANK PERFORMANCE, COMPLIANCE ISSUES, AND RISK TO DEVELOPMENT OUTCOME > B. ENVIRONMENTAL, SOCIAL, AND FIDUCIAR |  | 70. Financial Management (FM) and Procurement were rated MS for most of the project, except for an MU rating for procurement in the second project ISR 45. During implementation, shortcomings in procurement included delays in the contr"}], "actual": "signed 2024-07-08, 206 days from notice to signing (slow for its peer group: no); model A range P10-P90 70-322 days, P50 127"}, {"id": "r05", "country": "PH", "category": "GO", "method": "Request for Bids", "notice_date": "2024-09-10", "description": "Procurement of Vehicles:\n1) Marine and Coastal Zoning Management - Vehicle support to implementation, LGU and stakeholder coordination \n2) Monitoring Control and Surveillance - Vehicle support to MCS implementation", "brief": "Package: The package covers vehicle procurement for marine/coastal zoning management and monitoring, control, and surveillance support in the Philippines under the Request for Bids method.\nStatus: complete\n\nTimeline: The timeline forecast assumes an Invitation for Bids notice type, a 30-day advertising period, a 5949-character notice length, and English language, but does not account for specific project complexity or internal approval delays. [forecast:8efe1a2f31d6, benchmark:country_method_category-b6e9e0b9]\n  model forecast for this package: median 98 days from tender notice to signing (P10 96, P90 262); probability of a slow tender 11% [forecast:8efe1a2f31d6]\n  peer group: median 198 days; 90th percentile 420 days [benchmark:country_method_category-b6e9e0b9]\n  the forecast median is 100 days shorter than the peer-group median\n\nMarket approach: Proceed with Request for Bids as planned, informed by precedents where similar vehicle packages in the region and globally utilized Request for Quotations with 1 to 3 firms in award notices. [contract:1821008, contract:1753945, contract:1727398, contract:1624879, contract:1686805, benchmark:country_method_category-b6e9e0b9]\n\nRisks and mitigations:\n  1. Lengthy internal approval processes for procurement plans and documents may cause delays in the procurement cycle. -> Initiate early internal reviews and secure approvals for procurement plans and technical specifications before the notice date. [lesson_chunk:P113151-31101058-0159]\n  2. Weak contract management could lead to delays during contract implementation. -> Establish clear contract management protocols and assign dedicated staff to monitor performance and resolve issues promptly. [lesson_chunk:P113151-31101058-0159]\n  3. Delays in preparing technical specifications or terms of reference may postpone the start of the procurement process. -> Ensure technical inputs and key consultants are available on time to finalize specifications before launching the tender. [document_chunk:P160929_27329358_0097, lesson_chunk:P160929-34175423-0066]\n\nSimilar precedents:\n  - contract:1821008 PROCUREMENT OF MONITORING CONTROL & SURVEILLANCE OUTFIT AND ACCESSORIES   : Procurement of monitoring, control, and surveillance outfit and accessories for fisheries management.\n  - contract:1753945 Procurement of 4x 4WD Vehicles (Pick- up)  : Procurement of 4x4WD vehicles (pick-up) for rural service delivery.\n  - contract:1727398 Contract Agreement For Procurement of Vehicles: Contract agreement for procurement of vehicles for agriculture and rural transformation.\n  - contract:1624879 Procurement of four vehicles: Procurement of four vehicles for smallholder agriculture development.\n  - contract:1686805 Procurement of Vehicles: Procurement of vehicles for economic management strengthening.", "cited": [{"record_id": "benchmark:country_method_category-b6e9e0b9", "text": "tender notice to signing, peer group: PH, Request for Bids, GO | P10/P50/P90 47.0/198.0/420.0 days, n=33"}, {"record_id": "contract:1624879", "text": "Procurement of four vehicles | LS, Request for Quotations, signed 2020-08-13, None days, winner SE-452499 MASERU TOYOTA"}, {"record_id": "contract:1686805", "text": "Procurement of Vehicles | GH, Request for Quotations, signed 2021-12-23, None days, winner SE-427279 AUTODREAM LTD"}, {"record_id": "contract:1727398", "text": "Contract Agreement For Procurement of Vehicles | SB, Request for Quotations, signed 2023-02-09, None days, winner SE-379684 ELA MOTORS"}, {"record_id": "contract:1753945", "text": "Procurement of 4x 4WD Vehicles (Pick- up)   | PG, Request for Quotations, signed 2023-11-21, None days, winner SE-442246 NIUFORD LIMITED"}, {"record_id": "contract:1821008", "text": "PROCUREMENT OF MONITORING CONTROL & SURVEILLANCE OUTFIT AND ACCESSORIES    | LR, Request for Quotations, signed 2023-07-28, None days, winner SE-445615 MATELCO INC."}, {"record_id": "document_chunk:P160929_27329358_0097", "text": "Project Appraisal Document / MRD MEF GDICDM > 1. The Government SOP includes provision for |  | However, another six months should be reserved in case of failure of any procurement process. Therefore, the procurement under this project would take about 30 months, provided the technical inputs and key consultants are available on time for the procurement start-up. 24. Prior review threshold. Th"}, {"record_id": "forecast:8efe1a2f31d6", "text": "model forecast of tender notice to signing for this package (P10-P90 is an 80% interval) | model P10/P50/P90 96.0/98.0/262.0 days, slow probability 0.11"}, {"record_id": "lesson_chunk:P113151-31101058-0159", "text": "Implementation Completion and Results Report / IV. Procurement |  | Procurement being conducted was generally acceptable to the Bank. Procurement performance was therefore rated Moderately Satisfactory during the project implementation. The procurement plan was cleared by the Bank and approved by MONRE/MPI from Project start and was subject to various updates to acc"}, {"record_id": "lesson_chunk:P160929-34175423-0066", "text": "Implementation Completion and Results Report / IV. BANK PERFORMANCE, COMPLIANCE ISSUES, AND RISK TO DEVELOPMENT OUTCOME > B. ENVIRONMENTAL, SOCIAL, AND FIDUCIAR |  | caused by community disturbance (i.e., noise, dust, impaired access to houses/businesses) during construction. All grievances were resolved, and none are pending. 62. Procurement. Over the course of implementation, 40 procurement pack"}], "actual": "signed 2024-12-03, 84 days from notice to signing (slow for its peer group: no); model A range P10-P90 54-390 days, P50 145"}, {"id": "r06", "country": "LK", "category": "CW", "method": "Request for Bids", "notice_date": "2023-10-13", "description": "Improvements to WG-4 D' canal including necessarry structure in illukkuchenai unit", "brief": "Package: This package covers improvements to the WG-4 D' canal and necessary structures in the Illukkuchenai unit in Sri Lanka under the Request for Bids method.\nStatus: complete\n\nTimeline: The timeline forecast relies on assumptions regarding the notice type, a 28-day advertising period, a 7862-character notice length, and English language, which do not account for specific local market capacity constraints or potential design changes. [forecast:88a7b08a9fef, benchmark:country_method_category-faf92c78]\n  model forecast for this package: median 134 days from tender notice to signing (P10 75, P90 279); probability of a slow tender 14% [forecast:88a7b08a9fef]\n  peer group: median 110 days; 90th percentile 239 days [benchmark:country_method_category-faf92c78]\n  the forecast median is 24 days longer than the peer-group median\n\nMarket approach: Proceed with Request for Bids as the method, informed by precedents in Sri Lanka and the region that utilized this method for similar civil works, noting that some precedents involved multiple firms in the award notice. [contract:1597245, contract:1695181, contract:1697391, contract:1728096, benchmark:country_method_category-faf92c78]\n\nRisks and mitigations:\n  1. Smaller contractors may face difficulties due to limited financial and technical resources to implement contracts timely. -> Strengthen post-qualification criteria and develop a comprehensive contract management plan to mitigate risks associated with contractor capacity. [document_chunk:P176164_33438633_0086]\n  2. Procurement delays may occur due to low quality bidding documents or slow adoption of compliant procedures. -> Ensure early procurement of contract packages and utilize project preparation consultants to prepare tender documents before consultant mobilization. [lesson_chunk:P123828-34118211-0110, lesson_chunk:P132173-32872360-0069]\n  3. Contract implementation may be delayed if works are awarded during the rainy season or late in the dry season. -> Adhere to proper time sequencing by awarding contracts by the end of the rainy season to allow for two full dry seasons for completion. [lesson_chunk:P123828-34118211-0110]\n  4. Collusive practices among contractors and high transaction costs for contract management may arise. -> Conduct market analysis through a Procurement Plan and Strategy Document and use stringent analysis of contractor information available in the CIDA website. [document_chunk:P176164_33438633_0086]\n\nSimilar precedents:\n  - contract:1597637 Improvements to LB main canal & D1 canal (Tr-01) at 0+000km to 3+000km in Inginimitiya scheme: Similar canal improvement works in Sri Lanka under the same project ID, though using Request for Quotations.\n  - contract:1597245 Improvements to G6 canal and field canals, Improvements to Gonagolla Branch canal from stn 4+000km to 5+000km, Construction of anicut & bridge in G10 drainage c: Similar canal improvement works in Sri Lanka using Request for Bids for civil works.\n  - contract:1695181 Lot-3: Improvement of Distributory -1,2 & 3 of Right Bank Main Canal including all their appurtenant canals.: Improvement of distributory canals in South Asia using Request for Bids.\n  - contract:1697391 Lot-2: Improvement of Suvankar Danra of Right Bank Main Canal including all its appurtenant canals.: Improvement of main canal and appurtenant canals in South Asia using Request for Bids.\n  - contract:1728096 Lot-B - Balance works of IRR06/Lot-1, for Dy-1/4A & Dy-1/4B of Branch-I of Eden Canal including all its appurtenant canals within the reach.: Balance works of branch canals in South Asia using Request for Bids.", "cited": [{"record_id": "benchmark:country_method_category-faf92c78", "text": "tender notice to signing, peer group: LK, Request for Bids, CW | P10/P50/P90 69.0/110.0/239.0 days, n=190"}, {"record_id": "contract:1597245", "text": "Improvements to G6 canal and field canals, Improvements to Gonagolla Branch canal from stn 4+000km to 5+000km, Construction of anicut & bridge in G10 drainage c | LK, Request for Bids, signed 2019-10-01, None days, winner SE-1022543 ATHAMBAWA AND SONS"}, {"record_id": "contract:1597637", "text": "Improvements to LB main canal & D1 canal (Tr-01) at 0+000km to 3+000km in Inginimitiya scheme | LK, Request for Quotations, signed 2019-08-16, None days, winner SE-525938 THARINDU CONSTRUCTION"}, {"record_id": "contract:1695181", "text": "Lot-3: Improvement of Distributory -1,2 & 3 of Right Bank Main Canal including all their appurtenant canals. | IN, Request for Bids, signed 2022-05-10, 188 days, winner SE-431649 CHAKRABORTY CONSTRUCTION"}, {"record_id": "contract:1697391", "text": "Lot-2: Improvement of Suvankar Danra of Right Bank Main Canal including all its appurtenant canals. | IN, Request for Bids, signed 2022-05-26, 204 days, winner SE-632874 TRADERS & ENGINEERS PRIVATE LIMITED"}, {"record_id": "contract:1728096", "text": "Lot-B - Balance works of IRR06/Lot-1, for Dy-1/4A & Dy-1/4B of Branch-I of Eden Canal including all its appurtenant canals within the reach. | IN, Request for Bids, signed 2023-05-03, 107 days, winner SE-637767 JOY DURGA CONSTRUCTION"}, {"record_id": "document_chunk:P176164_33438633_0086", "text": "Project Appraisal Document / ANNEX 2: Implementation Arrangements and Support Plan > 3. The Contracting Industry Development Authority (CIDA) (formerly ICTAD) i |  | Difficulty in smaller contractors having • Post qualification criteria to be strengthened. limited financial and technical resources to • A comprehensive Contract Management plan to implement the contracts in a timely manner. be devel"}, {"record_id": "forecast:88a7b08a9fef", "text": "model forecast of tender notice to signing for this package (P10-P90 is an 80% interval) | model P10/P50/P90 75.0/134.0/279.0 days, slow probability 0.14"}, {"record_id": "lesson_chunk:P123828-34118211-0110", "text": "Implementation Completion and Results Report / ANNEX 5. BORROWER, CO-FINANCIER AND OTHER PARTNER/STAKEHOLDER COMMENTS > Lessons Learned |  | Importance of time sequencing of Implementation. On many occasions LGED awarded civil works contracts at the beginning of rainy season or late in the dry season, resulting in non-activity of contractors due to this half of the year pass without work that dela"}, {"record_id": "lesson_chunk:P132173-32872360-0069", "text": "Implementation Completion and Results Report / IV. BANK PERFORMANCE, COMPLIANCE ISSUES, AND RISK TO DEVELOPMENT OUTCOME > Procurement |  | 82. Procurement was rated in the Satisfactory range by the World Bank until a downgrade to “Moderately Unsatisfactory” in late 2019, primarily due to poor procurement practices in Bihar. Despite positive ratings for most of the project period, procurement delay"}], "actual": "signed 2024-01-16, 95 days from notice to signing (slow for its peer group: no); model A range P10-P90 63-284 days, P50 117"}, {"id": "r07", "country": "", "category": "GO", "method": "Request for Bids", "notice_date": "2023-12-21", "description": "Acquisition of IT Equipment for Institutional Strengthening SDAE, CED and Training Center within the scope of FCID and for Connectivity of INIP and INNOQ with Other Agencies", "brief": "Package: The package covers the acquisition of IT equipment for institutional strengthening and connectivity across multiple agencies under project P164847 using the Request for Bids method.\nStatus: complete\n\nTimeline: The timeline forecast relies on model assumptions including an Invitation for Bids notice type, a 30-day advertising period, a 5949-character notice length, English language, and no governance indicators, though it notes the country is not recognized in the model features. [forecast:219b48ee4ac5, benchmark:method_category-be7ce1a5]\n  model forecast for this package: median 142 days from tender notice to signing (P10 87, P90 367); probability of a slow tender 30% [forecast:219b48ee4ac5]\n  peer group: median 138 days; 90th percentile 305 days [benchmark:method_category-be7ce1a5]\n  the forecast median is 4 days longer than the peer-group median\n\nMarket approach: Proceed with Request for Bids as the primary method, consistent with the planned notice and precedents for similar IT equipment lots, while considering the precedent of using Request for Quotations for smaller server-related equipment to ensure competition. [contract:1628251, contract:1700859, contract:1647016, contract:1715931, benchmark:method_category-be7ce1a5]\n\nRisks and mitigations:\n  1. Inadequate institutional and human capacities may lead to delays in procurement implementation and poor contract management. -> Recruit a Procurement Specialist with World Bank procurement experience and provide continuous training on the New Procurement Framework. [document_chunk:P172434_33121053_0088, document_chunk:P168772_33603102_0078]\n  2. Limited competition in specialized IT markets with few bidders may restrict competition, increase prices, and raise collusion risks. -> Conduct upfront market engagement and consider packaging strategies to attract more bidders, as seen in precedents with varying numbers of firms. [document_chunk:P168772_33603102_0078, contract:1715931, contract:1647016]\n  3. Contractor issues such as shortage of materials, working capital shortfalls, and poor planning may cause delays in delivery and contract completion. -> Implement strict contract monitoring, consider upfront payment mechanisms for material acquisition to assist contractor cashflow, and hire contract management consultants. [lesson_chunk:P125565-34219519-0071, lesson_chunk:P125689-33807342-0213]\n  4. Inadequate communication and interaction between beneficiaries and the Project Implementation Unit may lead to delays and poor cost estimations. -> Develop a procurement section in procedure manuals to clarify roles and establish regular communication channels between beneficiaries and the PIU. [document_chunk:P175803_33789599_0080, document_chunk:P167798_33717698_0188]\n\nSimilar precedents:\n  - contract:1742662 Supply of IT Equipment for access to finance for recovery and resilience project (laptops, big printer): Supply of IT equipment including laptops and printers for a recovery project, similar category and method.\n  - contract:1628251 Contract for the Procurement of Desktops, Laptops, and Other Office Equipment Lot 1: Procurement of desktops, laptops, and office equipment using Request for Bids for institutional strengthening.\n  - contract:1700859 Contract for Procurement of Desktops, Laptops, and Other Office Equipment - Lot 2 and Lot 3: Procurement of desktops, laptops, and office equipment in multiple lots using Request for Bids.\n  - contract:1647016 Contract for the Procurement of Server, and Other Related Equipment for the Implementation of the EFT: Procurement of servers and related equipment, relevant for the connectivity aspect of the package.\n  - contract:1715931 ACQUISITION OF IT EQUIPMENT FOR MOZLAND PCU (LOT #1): Acquisition of IT equipment for a land administration project using Request for Bids with multiple bidders.", "cited": [{"record_id": "benchmark:method_category-be7ce1a5", "text": "tender notice to signing, peer group: all regions, Request for Bids, GO | P10/P50/P90 59.0/138.0/305.0 days, n=4734"}, {"record_id": "contract:1628251", "text": "Contract for the Procurement of Desktops, Laptops, and Other Office Equipment Lot 1 | LR, Request for Bids, signed 2020-07-28, None days, winner SE-183835 CROSSWORDS"}, {"record_id": "contract:1647016", "text": "Contract for the Procurement of Server, and Other Related Equipment for the Implementation of the EFT | LR, Request for Quotations, signed 2020-12-15, None days, winner SE-454657 NEXT TECHNOLOGY SOLUTION"}, {"record_id": "contract:1700859", "text": "Contract for Procurement of Desktops, Laptops, and Other Office Equipment - Lot 2 and Lot 3 | LR, Request for Bids, signed 2021-01-05, None days, winner SE-1118011 COMPUTER SHOP"}, {"record_id": "contract:1715931", "text": "ACQUISITION OF IT EQUIPMENT FOR MOZLAND PCU (LOT #1) | MZ, Request for Bids, signed 2022-06-30, None days, winner SE-1034516 TRIANA BUSINESS SOLUTIONS, LDA"}, {"record_id": "contract:1742662", "text": "Supply of IT Equipment for access to finance for recovery and resilience project (laptops, big printer) | RW, Request for Proposals, signed 2022-11-30, 79 days, winner SE-1056597 ITECH DEVICES LTD"}, {"record_id": "document_chunk:P167798_33717698_0188", "text": "Project Appraisal Document / IN BOTH COUNTRIES > C. Procurement |  | All these risks can cause remedial actions by the World Bank; possible delays in evaluation of bids; and technical proposals leading to implementation delays, poor quality of contract deliverables, and reputational risks to the World Bank and the project. 62. The overall procurement risk for the pro"}, {"record_id": "document_chunk:P168772_33603102_0078", "text": "Project Appraisal Document / IV. PROJECT APPRAISAL SUMMARY > B. Fiduciary |  | 89. The proposed project will use the Systematic Tracking of Exchanges in Procurement (STEP) system. STEP is a planning and tracking system which would provide data on procurement activities, establish benchmarks, monitor delays, and measure procurement performance. 90. A procurement assessment was"}, {"record_id": "document_chunk:P172434_33121053_0088", "text": "Project Appraisal Document / IV. PROJECT APPRAISAL SUMMARY > B. Fiduciary |  | The PP also includes the cost estimates, time schedules, the World Bank’s review requirements, brief description of the activities/contracts etc. The PP will be updated regularly to reflect actual project implementation needs, but each update shall require World Bank approval. All PPs will be public"}, {"record_id": "document_chunk:P175803_33789599_0080", "text": "Project Appraisal Document / IV. PROJECT APPRAISAL SUMMARY > B. Fiduciary |  | Second, there might be a lack of proficient procurement staff to implement procurement actions. Third, there might be concern about meeting the timeline of and complying with World Bank procurement procedures. Moreover, inadequate communication and interaction between the beneficiaries and the MENPC"}, {"record_id": "forecast:219b48ee4ac5", "text": "model forecast of tender notice to signing for this package (P10-P90 is an 80% interval) | model P10/P50/P90 87.0/142.0/367.0 days, slow probability 0.3"}, {"record_id": "lesson_chunk:P125565-34219519-0071", "text": "Implementation Completion and Results Report / III. KEY FACTORS THAT AFFECTED IMPLEMENTATION AND OUTCOME > B. KEY FACTORS DURING IMPLEMENTATION |  | 57. Contractor issues. There were various contractor issues, including a shortage of materials, shortfalls in working capital, and low human resources affecting their ability to deliver on the activities in a timely manner and recoup time lost due to "}, {"record_id": "lesson_chunk:P125689-33807342-0213", "text": "Implementation Completion and Results Report / 2 KPO > 7. Lessons Learned and Recommendations |  | During negotiations and contract signing for development of an AIS, special attention should be paid to the period for assignment implementation and its quality, as well as careful analysis of business processes to be computerized. It is recommended to conduct careful monitoring of the period and qu"}], "actual": "signed 2024-05-27, 158 days from notice to signing (slow for its peer group: no); model A range P10-P90 83-354 days, P50 136"}, {"id": "r08", "country": "CO", "category": "NC", "method": "Request for Bids", "notice_date": "2023-10-18", "description": "Contratar con enfoque de catastro multipropósito los servicios de migración de sistemas misionales de la SNR de conformidad con las características y condiciones establecidas en los anexos técnicos que forman parte integral de la Solicitud de Oferta - SDO", "brief": "Package: The package covers hiring services for the migration of mission-critical systems for the SNR using a multipurpose cadastral approach under Request for Bids.\nStatus: partial\n\nTimeline: The timeline forecast assumes an Invitation for Bids notice type, a 27-day advertising period, a 6103-character notice length, and Spanish language, but does not account for specific project complexity or local institutional capacity constraints. [forecast:077eaa7216dc, benchmark:region_method_category-55fa6fc5]\n  model forecast for this package: median 111 days from tender notice to signing (P10 63, P90 228); probability of a slow tender 11% [forecast:077eaa7216dc]\n  peer group: median 114 days; 90th percentile 327 days [benchmark:region_method_category-55fa6fc5]\n  the forecast median is 3 days shorter than the peer-group median\n\nMarket approach: Proceed with Request for Bids as the planned method, consistent with the peer group benchmark for Latin America and Caribbean NC contracts and the package's planned method. [benchmark:region_method_category-55fa6fc5]\n\nRisks and mitigations:\n  1. Legacy data quality may be insufficient for effective migration to new systems, increasing costs for data recollection. -> Conduct a thorough data quality assessment and feasibility study for digitizing legacy records prior to contract signing. [document_chunk:P175987_33191006_0128]\n  2. Technology and vendor lock-in could compromise the financial sustainability of the ICT systems. -> Apply best architecture practices including modular approaches and open standards to enable market-based competition. [document_chunk:P175987_33191006_0128]\n  3. Absence of legal reforms for e-transactions and cybersecurity could negatively impact data security and system investments. -> Provide technical assistance to articulate and implement necessary legal reforms alongside the procurement process. [document_chunk:P175987_33191006_0127]\n  4. Limited technological maturity and skilled resources in the country may hinder the establishment of interoperability and identity management standards. -> Ensure the procurement includes capacity building components and requires vendors to transfer knowledge to local staff. [document_chunk:P175987_33191006_0127]\n\nSimilar precedents:\n  none (no close precedent found)\n\nEvidence gaps:\n  - No close precedent found for this specific package in the contract records.", "cited": [{"record_id": "benchmark:region_method_category-55fa6fc5", "text": "tender notice to signing, peer group: Latin America and Caribbean, Request for Bids, NC | P10/P50/P90 40.0/114.0/327.0 days, n=127"}, {"record_id": "document_chunk:P175987_33191006_0127", "text": "Project Appraisal Document / VI. KEY RISKS |  | Furthermore, the absence of legal reforms to the enabling environment for e-transactions and cybersecurity could negatively impact the investments in cybersecurity capacity, as well as the security of the data exchanged using the interoperability platform. As a mitigation measure, the project will p"}, {"record_id": "document_chunk:P175987_33191006_0128", "text": "Project Appraisal Document / VI. KEY RISKS |  | Concerning legal ID, there are risks that legacy data that may be migrated in the new legal ID systems – including the IBOGA voter ID registry and the paper-based CR system – will not be of sufficient quality or standard to migrate effectively to new systems, which could increase cost associated wit"}, {"record_id": "forecast:077eaa7216dc", "text": "model forecast of tender notice to signing for this package (P10-P90 is an 80% interval) | model P10/P50/P90 63.0/111.0/228.0 days, slow probability 0.11"}], "actual": "signed 2023-12-28, 71 days from notice to signing (slow for its peer group: no); model A range P10-P90 89-307 days, P50 160"}, {"id": "r09", "country": "PH", "category": "CW", "method": "Request for Bids", "notice_date": "2024-04-23", "description": "Concreting of Sering - Plaridel FMR", "brief": "Package: The package covers the concreting of the Sering-Plaridel Farm-to-Market Road in the Philippines under the Request for Bids method.\nStatus: complete\n\nTimeline: The timeline forecast assumes an Invitation for Bids notice type, a 28-day advertising period, a 7862-character notice length, and English language, but does not account for specific project constraints or local permitting delays. [forecast:9a9ff48de83e, benchmark:country_method_category-5f71abf9]\n  model forecast for this package: median 103 days from tender notice to signing (P10 59, P90 305); probability of a slow tender 15% [forecast:9a9ff48de83e]\n  peer group: median 35 days; 90th percentile 250 days [benchmark:country_method_category-5f71abf9]\n  the forecast median is 68 days longer than the peer-group median\n\nMarket approach: Proceed with Request for Bids as the primary method, leveraging the precedent of high competition seen in similar Philippine rural road concreting contracts where up to 11 firms participated, while ensuring clear technical specifications to avoid qualification complaints. [contract:1759454, contract:1643151, contract:1649726, contract:1775535, contract:1644505, lesson_chunk:P132621-33964146-0065]\n\nRisks and mitigations:\n  1. Procurement delays may occur due to lack of procurement capacity or unfamiliarity with Bank policies, as seen in previous projects. -> Implement capacity building through learning by doing and conduct market engagement surveys prior to document preparation. [lesson_chunk:P132621-33964146-0065]\n  2. Contractor performance may be poor, leading to contract termination and re-tendering, particularly if lots are too small or contractors lack experience. -> Include clauses requiring minimum physical progress rates and apply penalties for underperformance while offering bonuses for overperformance. [lesson_chunk:P151832-33952864-0065, lesson_chunk:P151449-34305159-0090]\n  3. Frequent complaints regarding bidding qualification criteria and technical specifications may arise, potentially leading to investigations and delays. -> Ensure bid documents are clear and aligned with market surveys to minimize disputes over qualifications and specifications. [lesson_chunk:P132621-33964146-0065]\n  4. Low levels of competition may result in rebidding, especially in remote areas or if the contract size is unattractive to larger firms. -> Consider dividing works into smaller lots to allow domestic companies to compete, while ensuring the lot size is sufficient to attract experienced contractors. [lesson_chunk:P124639-33763091-0070, lesson_chunk:P151449-34305159-0090]\n\nSimilar precedents:\n  - contract:1775535 Concreting and improvement of Rosario FMR (Phase 1): Concreting of Rosario FMR (Phase 1) in the Philippines under the same project and method.\n  - contract:1643151 Concreting of Saliao-Daladap-Guiamalia FMR: Concreting of Saliao-Daladap-Guiamalia FMR in the Philippines with similar scope and method.\n  - contract:1649726 Concreting of Sumbac-Onica FMR: Concreting of Sumbac-Onica FMR in the Philippines with similar scope and method.\n  - contract:1759454 Concreting of Buracan-Dimalco-Dapagan-Masay FMR: Concreting of Buracan-Dimalco-Dapagan-Masay FMR in the Philippines with high competition (11 firms).\n  - contract:1644505 Road Concreting of Tamar-Fukol FMR with Bridge: Road Concreting of Tamar-Fukol FMR with Bridge in the Philippines under the same project and method.", "cited": [{"record_id": "benchmark:country_method_category-5f71abf9", "text": "tender notice to signing, peer group: PH, Request for Bids, CW | P10/P50/P90 35.0/35.0/250.0 days, n=85"}, {"record_id": "contract:1643151", "text": "Concreting of Saliao-Daladap-Guiamalia FMR | PH, Request for Bids, signed 2019-12-23, None days, winner SE-438768 ALPHA & OMEGA GEN. CONTRACTOR & DEVELOPMENT CORP."}, {"record_id": "contract:1644505", "text": "Road Concreting of Tamar-Fukol FMR with Bridge | PH, Request for Bids, signed 2020-10-26, None days, winner SE-561603 FFJJ CONSTRUCTION"}, {"record_id": "contract:1649726", "text": "Concreting of Sumbac-Onica FMR | PH, Request for Bids, signed 2019-09-12, None days, winner SE-1021039 JARGON CONSTRUCTION AND SUPPLY"}, {"record_id": "contract:1759454", "text": "Concreting of Buracan-Dimalco-Dapagan-Masay FMR | PH, Request for Bids, signed 2023-12-27, None days, winner SE-542207 PYRAMID CONSOLIDATED BUILDERS & GENERAL MERCHANDISE"}, {"record_id": "contract:1775535", "text": "Concreting and improvement of Rosario FMR (Phase 1) | PH, Request for Bids, signed 2023-11-09, None days, winner SE-853381 M.V. CALDO CONSTRUCTION AND SUPPLY CORPORATION"}, {"record_id": "forecast:9a9ff48de83e", "text": "model forecast of tender notice to signing for this package (P10-P90 is an 80% interval) | model P10/P50/P90 59.0/103.0/305.0 days, slow probability 0.15"}, {"record_id": "lesson_chunk:P124639-33763091-0070", "text": "Implementation Completion and Results Report / IV. BANK PERFORMANCE, COMPLIANCE ISSUES, AND RISK TO DEVELOPMENT OUTCOME > B. ENVIRONMENTAL, SOCIAL, AND FIDUCIAR |  | 67. Procurement. The project used modified country systems for procuring and awarding civil works contracts. The modifications to the bid documents helped to bridge the shortfalls identified as part of the country system assessment co"}, {"record_id": "lesson_chunk:P132621-33964146-0065", "text": "Implementation Completion and Results Report / IV. BANK PERFORMANCE, COMPLIANCE ISSUES, AND RISK TO DEVELOPMENT OUTCOME > B. ENVIRONMENTAL, SOCIAL, AND FIDUCIAR |  | 71. Procurement. Forty-six contracts were included in the final updated procurement plan. Of which, six contracts are for works, twenty-eight for goods, nine for consulting services, one for data collection, and two for training activ"}, {"record_id": "lesson_chunk:P151449-34305159-0090", "text": "Implementation Completion and Results Report / IV. BANK PERFORMANCE, COMPLIANCE ISSUES, AND RISK TO DEVELOPMENT OUTCOME > Fiduciary |  | 100. Procurement was a challenge throughout Project implementation, but the PCU was able to overcome difficulties in contractor performance and lengthy lead times for key procurements. Turnover of procurement personnel in the PCU had to be managed. The departure "}, {"record_id": "lesson_chunk:P151832-33952864-0065", "text": "Implementation Completion and Results Report / III. KEY FACTORS THAT AFFECTED IMPLEMENTATION AND OUTCOME > Factors Subject to World Bank Control |  | 56. Proactive guidance from the task team and appropriate adaptation to changing conditions contributed to limit implementation delays. As a transitional measure to address the low responsiveness of the coordinator and pending the recruitment of a re"}], "actual": "signed 2024-07-17, 85 days from notice to signing (slow for its peer group: no); model A range P10-P90 60-304 days, P50 103"}, {"id": "r10", "country": "PE", "category": "CS", "method": "Quality And Cost-Based Selection", "notice_date": "2024-05-13", "description": "Elaboración del Expediente Técnico de la obra \"Centro Macrorregional de Salud Pública Centro - CMC\" del Proyecto de Inversión con CUI N° 2502896 \"Mejoramiento y ampliación de los servicios brindados por el Sistema Nacional de Vigilancia Pública 25 departa", "brief": "Package: The package covers the Elaboración del Expediente Técnico for the Centro Macrorregional de Salud Pública Centro (CMC) under project P174177 in Peru, using Quality And Cost-Based Selection.\nStatus: complete\n\nTimeline: The timeline forecast assumes a Request for Expression of Interest notice type, an 18-day advertising period, a 6867-character notice length, and Spanish language, but does not account for specific project readiness or institutional capacity constraints. [forecast:0506066b1890, benchmark:country_method_category-82228188]\n  model forecast for this package: median 211 days from tender notice to signing (P10 127, P90 458); probability of a slow tender 13% [forecast:0506066b1890]\n  peer group: median 190 days; 90th percentile 317 days [benchmark:country_method_category-82228188]\n  the forecast median is 21 days longer than the peer-group median\n\nMarket approach: Proceed with Quality And Cost-Based Selection as used in precedents, noting that recent similar contracts in the same project attracted between 2 and 6 bidding firms. [contract:1743691, contract:1743687, contract:1755956, contract:1869269, contract:1869249]\n\nRisks and mitigations:\n  1. Lack of technical and operational readiness during preparation may cause implementation delays that are never overcome. -> Ensure key contracts reach advanced stages of procurement and conduct effective studies prior to approval to streamline implementation. [lesson_chunk:P151077-33464441-0072]\n  2. Excessive bureaucratic layers in government approval processes can delay implementation and achievement of outputs. -> Complete more works during project preparation, such as approval of feasibility studies and preparation of tender documents, to reduce initial delays. [lesson_chunk:P118197-33836668-0087]\n  3. High complexity in procurement processes can lead to supplier complaints and jeopardize implementation. -> Facilitate specialist visits for complex procurement packages to ensure compliance and reduce the risk of ineligible offers or rebidding. [lesson_chunk:P123146-32187237-0079]\n  4. Absence of key project staff or lack of familiarity with Bank procedures by new leadership can cause significant delays. -> Ensure essential staff are in place and involved in preparation to maintain commitment and understanding of requirements. [lesson_chunk:P129539-34123940-0072]\n\nSimilar precedents:\n  - contract:1743691 Elaboración del Expediente Técnico del Edificio de la Central 911 del Proyecto Creación de un Sistema de Atención de Emergencias, Urgencias e Información Median: Similar technical assistance for an emergency system in Peru using the same selection method.\n  - contract:1743687 Elaboración de expediente técnico de obra y equipamiento del proyecto: Mejoramiento y ampliación de los servicios de salud - RIS Trujillo - La Libertad. : Elaboration of technical file for a health improvement project in Peru with the same selection method.\n  - contract:1755956 Elaboración del expediente técnico de obra y equipamiento del proyecto: Mejoramiento de la gestión de productos farmacéuticos y dispositivos médicos a nivel de : Elaboration of technical file for health equipment in Peru with the same selection method.\n  - contract:1629581 Contratación de consultoría para la Elaboración de los Términos de Referencia para la elaboración del expediente técnico obra y para la supervisión del expedien: Consultancy for terms of reference and technical file elaboration in the same health network project.\n  - contract:1747934  CONTRATACIÓN DE UN ESPECIALISTA EN TECNOLOGÍAS EN LA NUBE PARA LA SUPERVISIÓN DE LA ELABORACIÓN DEL EXPEDIENTE TÉCNICO DEL PROYECTO: SBCC 07-2022 CENTRO DE DAT: Specialist supervision for technical file elaboration in the same health network project.", "cited": [{"record_id": "benchmark:country_method_category-82228188", "text": "tender notice to signing, peer group: PE, Quality And Cost-Based Selection, CS | P10/P50/P90 104.0/190.0/317.0 days, n=30"}, {"record_id": "contract:1629581", "text": "Contratación de consultoría para la Elaboración de los Términos de Referencia para la elaboración del expediente técnico obra y para la supervisión del expedien | PE, Individual Consultant Selection, signed 2020-08-04, None days, winner individual consultant (anonymised)"}, {"record_id": "contract:1743687", "text": "Elaboración de expediente técnico de obra y equipamiento del proyecto: Mejoramiento y ampliación de los servicios de salud - RIS Trujillo - La Libertad.  | PE, Quality And Cost-Based Selection, signed 2023-03-08, 148 days, winner SE-701209 DEXTRE + MORIMOTO ARQUITECTOS SOCIEDAD ANONIMA CERRADA"}, {"record_id": "contract:1743691", "text": "Elaboración del Expediente Técnico del Edificio de la Central 911 del Proyecto Creación de un Sistema de  that carry over the entire project period. While the AKWSP succeeded in achieving its development impact, the project experienced several delays, some of which are rooted in the preparation phase. Ensuring project read"}, {"record_id": "lesson_chunk:P123146-32187237-0079", "text": "Implementation Completion and Results Report / IV. BANK PERFORMANCE, COMPLIANCE ISSUES, AND RISK TO DEVELOPMENT OUTCOME > Fiduciary Compliance |  | 74. Although above ageements helped expedite procurement, and the implementing agenciesâ€™ procurement management was strong, the large number of complex procurement processes, were the main reason for delays in project execution. There were many compl"}, {"record_id": "lesson_chunk:P129539-34123940-0072", "text": "Implementation Completion and Results Report / III. KEY FACTORS THAT AFFECTED IMPLEMENTATION AND OUTCOME > B. KEY FACTORS DURING IMPLEMENTATION |  | 73. Given that the new MoH leadership was not involved in Project preparation, initially there was uncertainty regarding the project’s vision, priorities, and goals. The new technical staff of the MoH and HIF responsible for Project implementation wer"}, {"record_id": "lesson_chunk:P151077-33464441-0072", "text": "Implementation Completion and Results Report / V. LESSONS AND RECOMMENDATIONS |  | 93. Lesson 2. Readiness should have been assessed and ensured during preparation. The lack of technical and operational readiness for infrastructure design and implementation at appraisal caused delays in implementation that were never overcome during implementation. The operational timeline set out"}], "actual": "signed 2025-03-18, 309 days from notice to signing (slow for its peer group: no); model A range P10-P90 112-418 days, P50 193"}, {"id": "r11", "country": "3W", "category": "GO", "method": "Request for Bids", "notice_date": "2023-08-11", "description": "Design, Supply, Installation & Commissioning of Solar Parks with Battery Storage Systems (BESS)  in Liberia, Sierra Leone and Chad", "brief": "Package: This package covers the Design, Supply, Installation, and Commissioning of Solar Parks with Battery Storage Systems in Liberia, Sierra Leone, and Chad under the Request for Bids method.\nStatus: complete\n\nTimeline: The timeline forecast relies on assumptions regarding notice type, advertising period, notice length, language, and missing governance indicators, while the peer group benchmark is based on the country-method-category level. [forecast:abe399179c60, benchmark:country_method_category-44e29b30]\n  model forecast for this package: median 145 days from tender notice to signing (P10 86, P90 304); probability of a slow tender 45% [forecast:abe399179c60]\n  peer group: median 121 days; 90th percentile 336 days [benchmark:country_method_category-44e29b30]\n  the forecast median is 24 days longer than the peer-group median\n\nMarket approach: Proceed with Request for Bids as the procurement method, informed by precedents using the same method for solar and transmission site installations and the benchmark for the country-method-category peer group. [contract:1612904, contract:1677195, benchmark:country_method_category-44e29b30]\n\nRisks and mitigations:\n  1. Multi-country regional infrastructure projects are complex and tend to experience implementation delays due to unrealistic preparation and implementation schedules. -> Ensure realistic preparation and implementation schedules are established to avoid unnecessary delays. [document_chunk:P167569_33107529_0068]\n  2. Delays in delivery time and contract signing may occur due to low capacity of firms or unavailability of key staff. -> Regularly monitor contract execution progress and strictly apply late payment penalties to mitigate delivery delays. [document_chunk:P175982_33841539_0080, document_chunk:P167569_33107529_0139]\n  3. Shortage of containers and raw materials or low utility capacity for storage can cause significant delays in equipment supply. -> Adopt a turnkey contract strategy to place liability for just-in-time delivery of materials on contractors and provide capacity building on inventory management. [document_chunk:P176620_33735225_0082]\n  4. Risks related to forced labor in the supply chain may arise during implementation. -> Transfer identified risks to a day-to-day monitoring matrix and monitor them through monthly project implementation meetings. [document_chunk:P174495_33768298_0087]\n\nSimilar precedents:\n  - contract:1612904 Supply,Installation and Commissioning of a Back Up Solar System for 63 Kiosk Rooms: Involves supply, installation, and commissioning of a solar system using Request for Bids.\n  - contract:1677195 SUPPLY, INSTALLATION AND COMMISSIONING OF SOLAR PV SYSTEMS FOR 25 NBI PHASE I, II & III TRANSMISSION SITES: Involves supply, installation, and commissioning of solar PV systems using Request for Bids.", "cited": [{"record_id": "benchmark:country_method_category-44e29b30", "text": "tender notice to signing, peer group: LR, Request for Bids, GO | P10/P50/P90 73.0/121.0/336.0 days, n=64"}, {"record_id": "contract:1612904", "text": "Supply,Installation and Commissioning of a Back Up Solar System for 63 Kiosk Rooms | ZW, Request for Bids, signed 2020-05-07, 165 days, winner SE-464562 SOLAR ENERGY &ENVIRONMENTAL MONITORING AFRICA (SINET)"}, {"record_id": "contract:1677195", "text": "SUPPLY, INSTALLATION AND COMMISSIONING OF SOLAR PV SYSTEMS FOR 25 NBI PHASE I, II & III TRANSMISSION SITES | 3E, Request for Bids, signed 2020-12-14, 231 days, winner SE-620468 WHITE SHOWMANS(U)"}, {"record_id": "document_chunk:P167569_33107529_0068", "text": "Project Appraisal Document / IMPLEMENTATION DELAYS AND COUNTRY FRAGILITY |  | IMPLEMENTATION DELAYS AND COUNTRY FRAGILITY The procurement process and implementation A single procurement process facilitated at ECOWAS schedule should be simple and feasible to avoid level for DSI and Owner’s Engineers firms will generate unnecessary delays. Experience with the recent WAPP econom"}, {"record_id": "document_chunk:P167569_33107529_0139", "text": "Project Appraisal Document / CÔTE D’ IVOIRE |  | 48. The lead responsibility for project implementation will be vested with CI-ENERGIES. A PCU within the CI-ENERGIES will be named and act on behalf on CI-Energies. Key staff of the PCU will come from CI-ENERGIE and the national electricity company. The PCU within CI-ENERGIES will have the responsib"}, {"record_id": "document_chunk:P174495_33768298_0087", "text": "Project Appraisal Document / IV. PROJECT APPRAISAL SUMMARY > B. Fiduciary |  | These measures include, for each designated implementing agency, (a) having a full-time procurement specialist, who is experienced and familiar with the World Bank procurement procedures and policies, to be located in each PIU; (b) training all project staff involved in Procurement Regulations; (c)"}, {"record_id": "document_chunk:P175982_33841539_0080", "text": "Project Appraisal Document / IV. PROJECT APPRAISAL SUMMARY > C. Procurement |  | Delay in the evaluation of Organize residential evaluation sessions for major Client offers/proposals: markets Failure to respect the 5-day deadline Imposing deadline performance objectives on the imposed by decree 475 for the actors concerned evaluation of offers. Strictly comply with the procureme"}, {"record_id": "document_chunk:P176620_33735225_0082", "text": "Project Appraisal Document / PROJECT DESCRIPTION > F. Lessons Learned and Reflected in the Project Design |  | The World Bank is under discussion on how to capture the Emission Reductions benefit through the PADAES Project and hence solving the main problem identified in the CF operation. 90. A procurement strategy built on lessons learned from World Bank access projects. Some access activities fi"}, {"record_id": "forecast:abe399179c60", "text": "model forecast of tender notice to signing for this package (P10-P90 is an 80% interval) | model P10/P50/P90 86.0/145.0/304.0 days, slow probability 0.45"}], "actual": "signed 2024-08-13, 368 days from notice to signing (slow for its peer group: yes); model A range P10-P90 141-413 days, P50 279"}, {"id": "r12", "country": "3W", "category": "NC", "method": "Request for Bids", "notice_date": "2023-11-23", "description": "Location de véhicules 4X4 double cabines (277) destinés au Recensement général de la population et de l'habitat", "brief": "Package: The package covers the rental of 277 double-cab 4X4 vehicles for the National Population and Housing Census in country 3W using the Request for Bids method.\nStatus: complete\n\nTimeline: The timeline forecast assumes an Invitation for Bids notice type, a 27-day advertising period, a 6103-character notice length, and French language, but notes missing governance indicators for the country. [forecast:17d7db67f549, benchmark:region_method_category-54398579]\n  model forecast for this package: median 128 days from tender notice to signing (P10 77, P90 290); probability of a slow tender 26% [forecast:17d7db67f549]\n  peer group: median 141 days; 90th percentile 375 days [benchmark:region_method_category-54398579]\n  the forecast median is 13 days shorter than the peer-group median\n\nMarket approach: Proceed with Request for Bids as planned, informed by regional precedents where this method yielded a median duration of 141 days and precedents in the same country used Request for Quotations for similar vehicle rental services. [benchmark:region_method_category-54398579, contract:1660350, contract:1660679]\n\nRisks and mitigations:\n  1. Large-scale cash handling for enumerator payments or related logistics creates a risk of embezzlement and ineligible expenses. -> Adopt mobile banking or banking solutions for fund transfers instead of cash to reduce fraud risks. [lesson_chunk:P160071-33934833-0061]\n  2. Delays in procurement processes can cause key steps to fall behind the yearly procurement plan. -> Ensure strict adherence to the procurement plan and monitor key milestones to prevent slippage. [lesson_chunk:P101504-31403550-0092]\n  3. Paper-based systems increase the risk of loss from fraud and corruption in procurement and payments. -> Implement digital technologies and automated procurement systems to improve transparency and reduce administrative costs. [document_chunk:P174620_33753850_0088]\n\nSimilar precedents:\n  - contract:1660350 Vehicle Rental Services (Month 2) of Cartographic Phase of the National Population and Housing Census (NPHC) 2021: Rental of vehicle services for the cartographic phase of the National Population and Housing Census in the same country.\n  - contract:1660679 Vehicle Rental Services for Cartographic Phase of the National Population and Housing Census (NPHC) 2021: Rental of vehicle services for the cartographic phase of the National Population and Housing Census in the same country.", "cited": [{"record_id": "benchmark:region_method_category-54398579", "text": "tender notice to signing, peer group: Western and Central Africa, Request for Bids, NC | P10/P50/P90 53.0/141.0/375.0 days, n=82"}, {"record_id": "contract:1660350", "text": "Vehicle Rental Services (Month 2) of Cartographic Phase of the National Population and Housing Census (NPHC) 2021 | 3W, Request for Quotations, signed 2021-04-30, None days, winner SE-492736 UNITED BUSINESS SUPPLY"}, {"record_id": "contract:1660679", "text": "Vehicle Rental Services for Cartographic Phase of the National Population and Housing Census (NPHC) 2021 | 3W, Request for Quotations, signed 2020-11-17, None days, winner SE-522972 ZENITH MULTIPURPOSE COMPANY"}, {"record_id": "document_chunk:P174620_33753850_0088", "text": "Project Appraisal Document / IV. PROJECT APPRAISAL SUMMARY > A. Technical, Economic and Financial Analysis (if applicable) |  | 50Central African Republic Economic Update – Third Edition – The Central African Republic in Times of COVID-19 – Diversifying the Economy to Build Resilience and Foster Growth, World Bank Group, October 2020. the ASYCUDA World customs management system, in place of paper "}, {"record_id": "forecast:17d7db67f549", "text": "model forecast of tender notice to signing for this package (P10-P90 is an 80% interval) | model P10/P50/P90 77.0/128.0/290.0 days, slow probability 0.26"}, {"record_id": "lesson_chunk:P101504-31403550-0092", "text": "Implementation Completion and Results Report / IV. BANK PERFORMANCE, COMPLIANCE ISSUES, AND RISK TO DEVELOPMENT OUTCOME > B. ENVIRONMENTAL, SOCIAL, AND FIDUCIAR |  | 87. The project’s arrangements for activities under Components 2 through 6 involved the procurement of goods, non-consulting services (airline tickets, logistic and support services for training, workshops, printing, and so on), opera"}, {"record_id": "lesson_chunk:P160071-33934833-0061", "text": "Implementation Completion and Results Report / III. KEY FACTORS THAT AFFECTED IMPLEMENTATION AND OUTCOME > B. KEY FACTORS DURING IMPLEMENTATION |  | Discussions with the government concluded on prioritization of the completion of the census and conducting a household survey at the expense of some activities (National Accounts, CPI, new NSDS drafting and modernization of ICT and equipment). Also, o"}], "actual": "signed 2023-12-21, 28 days from notice to signing (slow for its peer group: no); model A range P10-P90 53-284 days, P50 120"}, {"id": "r13", "country": "ET", "category": "CW", "method": "Request for Bids", "notice_date": "2024-02-21", "description": "Procurement of installation of distribution network for 70 mini grids", "brief": "Package: This package covers the procurement of installation of distribution networks for 70 mini grids in Ethiopia using the Request for Bids method.\nStatus: complete\n\nTimeline: The timeline forecast assumes an Invitation for Bids notice type, a 28-day advertising period, a 7862-character notice length, and English language, but does not account for specific project readiness or local logistical constraints. [forecast:d75fdbc5ad18, benchmark:country_method_category-5882049a]\n  model forecast for this package: median 147 days from tender notice to signing (P10 68, P90 296); probability of a slow tender 43% [forecast:d75fdbc5ad18]\n  peer group: median 128 days; 90th percentile 248 days [benchmark:country_method_category-5882049a]\n  the forecast median is 19 days longer than the peer-group median\n\nMarket approach: Proceed with Request for Bids as the primary method, potentially utilizing a turnkey approach to assign liability for just-in-time material delivery to contractors, informed by precedents where single firms were awarded similar distribution network contracts. [contract:1773824, contract:1676530, contract:1722584, document_chunk:P176620_33735225_0082]\n\nRisks and mitigations:\n  1. Delays in procurement and implementation may occur due to low capacity in planning and undertaking the storage of key materials like cables and poles. -> Adopt a turnkey contract strategy to place liability for just-in-time delivery of materials and equipment on the contractors. [document_chunk:P176620_33735225_0082]\n  2. Contractor performance may be hindered by shortages of materials, shortfalls in working capital, and low human resources. -> Include clauses requiring minimum physical progress rates and apply financial penalties or bonuses to incentivize timely delivery and internal adjustments. [lesson_chunk:P125565-34219519-0071, lesson_chunk:P151832-33952864-0065]\n  3. Implementation delays may arise from delayed preparation and approval of bidding documents or inconsistencies in project schedules. -> Ensure early and rigorous preparation of bidding documents in compliance with guidelines and establish clear approval schedules to avoid delays. [lesson_chunk:P147277-34073027-0052]\n\nSimilar precedents:\n  - contract:1889915 Mini Grids Installation in Udot: Involves mini grid installation in a similar context, though using Direct Selection.\n  - contract:1773824 Design, Supply, Installation and Commissioning of six mini-grids and standalone systems in Udot and Eot, Chuuk State: Covers design, supply, and installation of mini-grids using Request for Bids.\n  - contract:1676530 11/0.4kV Distribution Network and Customer Connections in Freetown: Focuses on distribution network and customer connections using Request for Bids.\n  - contract:1722584 Design, Supply and Installation of Solar Photovoltaic Power Generation Plants (SPGP) with Associated Power Distribution Network (PDN), Operation and Maintenance: Includes installation of power generation plants with associated distribution networks.\n  - contract:1722590 Design, Supply and Installation of Solar Photovoltaic Power Generation Plants (SPGP) with Associated Power Distribution Network (PDN), Operation and Maintenance: Similar to 1722584, covering power generation and distribution network installation.", "cited": [{"record_id": "benchmark:country_method_category-5882049a", "text": "tender notice to signing, peer group: ET, Request for Bids, CW | P10/P50/P90 53.0/128.0/248.0 days, n=127"}, {"record_id": "contract:1676530", "text": "11/0.4kV Distribution Network and Customer Connections in Freetown | SL, Request for Bids, signed 2021-10-29, 402 days, winner SE-568376-2 3 ETAP ENERJI INSAAT SANAYI VE TICARET LIMITED SIRKETI"}, {"record_id": "contract:1722584", "text": "Design, Supply and Installation of Solar Photovoltaic Power Generation Plants (SPGP) with Associated Power Distribution Network (PDN), Operation and Maintenance | KE, Request for Bids, signed 2019-10-09, 317 days, winner SE-425568 KINGSHORE NEW RESOURCES ELECTRIC JIANGSU COMPANY LIMITED"}, {"record_id": "contract:1722590", "text": "Design, Supply and Installation of Solar Photovoltaic Power Generation Plants (SPGP) with Associated Power Distribution Network (PDN), Operation and Maintenance | KE, Request for Bids, signed 2020-09-30, 674 days, winner SE-425568 KINGSHORE NEW RESOURCES ELECTRIC JIANGSU COMPANY LIMITED"}, {"record_id": "contract:1773824", "text": "Design, Supply, Installation and Commissioning of six mini-grids and standalone systems in Udot and Eot, Chuuk State | FM, Request for Bids, signed 2023-10-20, 328 days, winner SE-1007475 Sino Soar Hybrid (Beijing) Technology Co., Ltd."}, {"record_id": "contract:1889915", "text": "Mini Grids Installation in Udot | FM, Direct Selection, signed 2023-10-20, None days, winner SE-1007475 Sino Soar Hybrid (Beijing) Technology Co., Ltd."}, {"record_id": "document_chunk:P176620_33735225_0082", "text": "Project Appraisal Document / PROJECT DESCRIPTION > F. Lessons Learned and Reflected in the Project Design |  | The World Bank is under discussion on how to capture the Emission Reductions benefit through the PADAES Project and hence solving the main problem identified in the CF operation. 90. A procurement strategy built on lessons learned from World Bank access projects. Some access activities fi"}, {"record_id": "forecast:d75fdbc5ad18", "text": "model forecast of tender notice to signing for this package (P10-P90 is an 80% interval) | model P10/P50/P90 68.0/147.0/296.0 days, slow probability 0.43"}, {"record_id": "lesson_chunk:P125565-34219519-0071", "text": "Implementation Completion and Results Report / III. KEY FACTORS THAT AFFECTED IMPLEMENTATION AND OUTCOME > B. KEY FACTORS DURING IMPLEMENTATION |  | 57. Contractor issues. There were various contractor issues, including a shortage of materials, shortfalls in working capital, and low human resources affecting their ability to deliver on the activities in a timely manner and recoup time lost due to "}, {"record_id": "lesson_chunk:P147277-34073027-0052", "text": "Implementation Completion and Results Report / III. KEY FACTORS THAT AFFECTED IMPLEMENTATION AND OUTCOME > B. KEY FACTORS DURING IMPLEMENTATION |  | Table 3. Factors That Affected Project Implementation Key Factors Subject to the Government and/or Subject to the World Outside the Project’s Implementing Entity’s Control Bank’s Control Control Major delays in loan • The compliance with the • Inconsi"}, {"record_id": "lesson_chunk:P151832-33952864-0065", "text": "Implementation Completion and Results Report / III. KEY FACTORS THAT AFFECTED IMPLEMENTATION AND OUTCOME > Factors Subject to World Bank Control |  | 56. Proactive guidance from the task team and appropriate adaptation to changing conditions contributed to limit implementation delays. As a transitional measure to address the low responsiveness of the coordinator and pending the recruitment of a re"}], "actual": "signed 2025-08-11, 537 days from notice to signing (slow for its peer group: yes); model A range P10-P90 93-389 days, P50 212"}, {"id": "r14", "country": "MZ", "category": "CS", "method": "Quality And Cost-Based Selection", "notice_date": "2024-05-30", "description": "Hiring a consultancy services for supervision of upgrading works of 15 primary schools into a basic schools in Niassa province", "brief": "Package: The package involves hiring consultancy services for the supervision of upgrading 15 primary schools into basic schools in Niassa province, Mozambique, using Quality and Cost-Based Selection.\nStatus: complete\n\nTimeline: The timeline forecast assumes a Request for Expression of Interest notice type, an 18-day advertising period, a 6867-character notice length, and Portuguese language, but does not account for specific project complexity or local capacity constraints. [forecast:beba44bff0da, benchmark:country_method_category-bbf4e516]\n  model forecast for this package: median 366 days from tender notice to signing (P10 175, P90 606); probability of a slow tender 26% [forecast:beba44bff0da]\n  peer group: median 430 days; 90th percentile 668 days [benchmark:country_method_category-bbf4e516]\n  the forecast median is 64 days shorter than the peer-group median\n\nMarket approach: Proceed with Quality and Cost-Based Selection as the planned method, consistent with the planned notice and precedents in the region and country, noting that similar school supervision contracts in the region have utilized Consultant Qualification Selection. [contract:1757381, contract:1702677, contract:1601464, contract:1780587, contract:1601468, benchmark:country_method_category-bbf4e516]\n\nRisks and mitigations:\n  1. Weak client capacity and high turnover of procurement specialists may lead to procurement delays and poor supervision quality. -> Ensure proactive guidance from the task team and establish clear transitionary arrangements to maintain continuity. [lesson_chunk:P123974-34033486-0067, lesson_chunk:P151832-33952864-0065]\n  2. Insufficient on-site supervision and low capacity of local contractors may result in poor construction quality. -> Introduce stricter quality selection criteria, enforce penalty measures for time and quality, and engage a dedicated supervision company. [lesson_chunk:P154464-34107773-0134]\n  3. Delays in payment processing and commissioning can negatively impact contractor performance and project timelines. -> Reinforce coordination to reduce invoice processing times and avoid retaining contract guarantees until full completion. [lesson_chunk:P145529-34182967-0074]\n  4. Managing multiple simultaneous contracts without effective monitoring tools can lead to inefficiencies and unresolved conflicts. -> Implement software for integrated contract monitoring and establish rigorous construction records to track progress. [lesson_chunk:P147277-34073027-0073]\n\nSimilar precedents:\n  - contract:1702677 DESIGN AND SUPERVISION OF MINOR RENOVATIONS OF PRIMARY SCHOOLS: Supervision of minor renovations of primary schools, similar scope and category.\n  - contract:1601464 Supervision of 4 High Schools rehabilitation works: Supervision of high school rehabilitation works, similar supervision role.\n  - contract:1780587 Technical Supervision of four High Schools Rehabilitation Works: Technical supervision of high school rehabilitation, similar technical oversight.\n  - contract:1601468 Supervision of 3 High Schools rehabilitation works: Supervision of high school rehabilitation works, similar supervision function.\n  - contract:1757381 CONTRACT MANAGEMENT AND WORKS SUPERVISION OF CONSTRUCTION OF CLASSROOM AND SANITATION BLOCKS IN SELECTED PRIMARY SCHOOLS IN MALAWI: Contract management and works supervision of primary school construction in a similar regional context.", "cited": [{"record_id": "benchmark:country_method_category-bbf4e516", "text": "tender notice to signing, peer group: MZ, Quality And Cost-Based Selection, CS | P10/P50/P90 278.0/430.0/668.0 days, n=166"}, {"record_id": "contract:1601464", "text": "Supervision of 4 High Schools rehabilitation works | AM, Consultant Qualification Selection, signed 2019-07-12, None days, winner SE-326994 PARAPET"}, {"record_id": "contract:1601468", "text": "Supervision of 3 High Schools rehabilitation works | AM, Consultant Qualification Selection, signed 2019-07-12, None days, winner SE-361955 SHINCERTIFICATE LLC"}, {"record_id": "contract:1702677", "text": "DESIGN AND SUPERVISION OF MINOR RENOVATIONS OF PRIMARY SCHOOLS | MK, Consultant Qualification Selection, signed 2022-06-17, None days, winner SE-465577 PRIMA INZENERING DOO SKOPJE"}, {"record_id": "contract:1757381", "text": "CONTRACT MANAGEMENT AND WORKS SUPERVISION OF CONSTRUCTION OF CLASSROOM AND SANITATION BLOCKS IN SELECTED PRIMARY SCHOOLS IN MALAWI | MW, Quality And Cost-Based Selection, signed 2023-07-03, 368 days, winner SE-119009 Hydroplan Ingenieur-Gesellschaft mit beschränkter Haftung"}, {"record_id": "contract:1780587", "text": "Technical Supervision of four High Schools Rehabilitation Works | AM, Consultant Qualification Selection, signed 2023-10-23, None days, winner SE-326994 PARAPET"}, {"record_id": "forecast:beba44bff0da", "text": "model forecast of tender notice to signing for this package (P10-P90 is an 80% interval) | model P10/P50/P90 175.0/366.0/606.0 days, slow probability 0.26"}, {"record_id": "lesson_chunk:P123974-34033486-0067", "text": "Implementation Completion and Results Report / 4 BANK PE
