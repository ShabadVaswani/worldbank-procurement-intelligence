l actions were taken to address this problem. Delays in payment were due to: (i) several instances of postponed commissioning (when, for example, the delayed finalization"}, {"id": "lesson_chunk:P151449-34305159-0090", "text": "Implementation Completion and Results Report / IV. BANK PERFORMANCE, COMPLIANCE ISSUES, AND RISK TO DEVELOPMENT OUTCOME > Fiduciary |  | 100. Procurement was a challenge throughout Project implementation, but the PCU was able to overcome difficulties in contractor performance and lengthy lead times for key procurements. Turnover of procurement personnel in the PCU had to be managed. The departure "}, {"id": "lesson_chunk:P151832-33952864-0065", "text": "Implementation Completion and Results Report / III. KEY FACTORS THAT AFFECTED IMPLEMENTATION AND OUTCOME > Factors Subject to World Bank Control |  | 56. Proactive guidance from the task team and appropriate adaptation to changing conditions contributed to limit implementation delays. As a transitional measure to address the low responsiveness of the coordinator and pending the recruitment of a re"}, {"id": "lesson_chunk:P158982-34302327-0087", "text": "Implementation Completion and Results Report / V. LESSONS AND RECOMMENDATIONS |  | 71. Reliance on specialized partners was key to attenuating a low-capacity implementation environment given the complexity of the Project’s governance and activities. The multisector nature of the Project meant several government entities were involved of implementing arrangements, which could have"}], "actual": "signed 2025-01-23, 216 days from notice to signing (slow for its peer group: yes); model A range P10-P90 78-287 days, P50 166", "questions": [{"field": "any_unsupported_claim", "question": "4. Is any factual claim NOT supported by its cited records?", "options": [["yes", "Yes"], ["no", "No"]], "n_listed": "", "votes": [{"judge": "gpt-oss-120b", "vote": "yes", "why": "unsupported: \"varying numbers of firms in award notices ranging from 1 to 8\". Claim 1 unsupported as no record cites award notice firm counts ranging from 1 to 8"}, {"judge": "llama-4-maverick", "vote": "no", "why": "all 1 checked claims supported."}, {"judge": "llama-3.3-70b", "vote": "no", "why": "all 1 checked claims supported. Claim 1 is supported by the brief, which mentions that precedents show varying numbers of firms in award notices ranging from 1 to 8."}]}]}, {"type": "brief", "id": "r21", "country": "LA", "category": "CS", "method": "Quality And Cost-Based Selection", "notice_date": "2023-11-20", "description": "Refurbishment,  Pakpasak TC", "brief": "Package: This package covers the refurbishment of Pakpasak TC in Laos using Quality and Cost-Based Selection for Consulting Services.\nStatus: partial\n\nTimeline: The timeline forecast relies on assumptions regarding the notice type, advertising period, notice length, and language, while the peer group benchmark is drawn from the East Asia and Pacific region. [forecast:5b157d1a8780, benchmark:region_method_category-364cd51d]\n  model forecast for this package: median 370 days from tender notice to signing (P10 187, P90 621); probability of a slow tender 21% [forecast:5b157d1a8780]\n  peer group: median 344 days; 90th percentile 629 days [benchmark:region_method_category-364cd51d]\n  the forecast median is 26 days longer than the peer-group median\n\nMarket approach: Proceed with Quality and Cost-Based Selection as the planned method, consistent with the peer group benchmark for this category and method in the East Asia and Pacific region. [benchmark:region_method_category-364cd51d]\n\nRisks and mitigations:\n  1. Delays in contract implementation may occur if contracts are awarded during the rainy season or late in the dry season, leading to periods of non-activity. -> Ensure time sequencing of implementation aligns with dry seasons to avoid half-year delays in contract execution. [lesson_chunk:P123828-34118211-0110]\n  2. Procurement delays can arise from pauses in prequalification or impasses regarding the participation of state-owned enterprises. -> Resolve procurement strategy and participation issues early with high-level involvement to prevent delays in bidding document publication. [lesson_chunk:P149697-33955100-0078]\n  3. Contractors may fail to meet compressed timelines if detailed design specifications and drawings are initiated late in the process. -> Initiate detailed design specifications, BOQ, and drawings well in advance to avoid compressing construction timelines. [lesson_chunk:P145502-33841581-0053]\n  4. Payment delays due to postponed commissioning or lengthy technical reviews of invoices can negatively affect contractors. -> Reinforce coordination to reduce invoice processing times and avoid retaining contract guarantees until all systems are tested. [lesson_chunk:P145529-34182967-0074]\n\nSimilar precedents:\n  none (no close precedent found)\n\nEvidence gaps:\n  - no close precedent found", "cited": [{"id": "benchmark:region_method_category-364cd51d", "text": "tender notice to signing, peer group: East Asia and Pacific, Quality And Cost-Based Selection, CS | P10/P50/P90 113.0/344.0/629.0 days, n=186"}, {"id": "forecast:5b157d1a8780", "text": "model forecast of tender notice to signing for this package (P10-P90 is an 80% interval) | model P10/P50/P90 187.0/370.0/621.0 days, slow probability 0.21"}, {"id": "lesson_chunk:P123828-34118211-0110", "text": "Implementation Completion and Results Report / ANNEX 5. BORROWER, CO-FINANCIER AND OTHER PARTNER/STAKEHOLDER COMMENTS > Lessons Learned |  | Importance of time sequencing of Implementation. On many occasions LGED awarded civil works contracts at the beginning of rainy season or late in the dry season, resulting in non-activity of contractors due to this half of the year pass without work that dela"}, {"id": "lesson_chunk:P145502-33841581-0053", "text": "Implementation Completion and Results Report / III. KEY FACTORS THAT AFFECTED IMPLEMENTATION AND OUTCOME > B. KEY FACTORS DURING IMPLEMENTATION |  | Two TPs that had been contracted in August 2016 were also cancelled due to non-compliance of the contractual requirements by the contracted company. In addition, there were delays in shortlisting for the CNM contracts. The five CNM packages were recon"}, {"id": "lesson_chunk:P145529-34182967-0074", "text": "Implementation Completion and Results Report / II. KEY FACTORS THAT AFFECTED IMPLEMENTATION AND OUTCOME > B. KEY FACTORS DURING IMPLEMENTATION |  | 58. The Project suffered from payment delays that affected contractors, but several actions were taken to address this problem. Delays in payment were due to: (i) several instances of postponed commissioning (when, for example, the delayed finalization"}, {"id": "lesson_chunk:P149697-33955100-0078", "text": "Implementation Completion and Results Report / IV. BANK PERFORMANCE, COMPLIANCE ISSUES, AND RISK TO DEVELOPMENT OUTCOME > Procurement |  | 94. A Procurement Capacity and Risk Assessment conducted during project preparation identified that the greatest risks were delays to large works contracts and cost overruns due to claims and variations. However, 35 World Bank Aide-Memoire for the Implementatio"}], "actual": "signed 2026-04-06, 868 days from notice to signing (slow for its peer group: yes); model A range P10-P90 104-456 days, P50 202", "questions": [{"field": "risks_relevant", "question": "3. How many of the listed risks are relevant and sensible?", "options": [["0", "0"], ["1", "1"], ["2", "2"], ["3", "3"], ["4", "4"]], "n_listed": "4.0", "votes": [{"judge": "gpt-oss-120b", "vote": "4", "why": "relevant: 1, 2, 3, 4; not relevant: 0. All four risks pertain to procurement or contract‑delivery issues for this refurbishment package"}, {"judge": "llama-4-maverick", "vote": "0", "why": "relevant: none; not relevant: 4. All risks listed are for works or contractors, not consulting services."}, {"judge": "llama-3.3-70b", "vote": "4", "why": "relevant: 1, 2, 3, 4; not relevant: 0. All risks listed are relevant and sensible for this package, as they pertain to potential issues that could arise during the procurement and contract implementat"}]}]}];
const RUBRIC={pair:"You decide whether two supplier records from World Bank contract data are the same real-world firm.\nYou get both names, their country, and up to three contracts each supplier signed (year, project, what was bought).\n\nAnswer \"same\" when the names identify one firm written differently: spelling variants and typos, transliteration,\nabbreviations and acronyms (LTD / LIMITED, ETS / ETABLISSEMENT, CO. / COMPANY), word order, an added or dropped legal\nform, branch-country suffix or bracketed translation, or \"M/S\" in front. The same joint venture with its members\nlisted in another order is \"same\".\nAnswer \"different\" when a distinctive word differs (another place, person, family or brand name, even if only one or\ntwo letters apart when the rest is generic), when the names share only generic words (CONSTRUCTION, TRADING, GENERAL\nSERVICES, ENGINEERING, CONSULTING, ENTERPRISES), when one record is a joint venture or consortium and the other only\none of its members, or when two different local units of one programme are named.\nNames of individual people (not firms): \"same\" only when the full names match (spelling variants and titles such as\nM/S, MD, MR allowed) AND the contracts point to one person: the same place (district, division, town) or the same\nspecific assignment. Sharing a project is not enough, since one project hires many people with common names. A name\nthat adds or drops a given name, a father's or a grandfather's name is another person (in naming systems that chain\nfather's names, \"A B C\" and \"D A B\" are father and son). If the contracts point to different places, answer\n\"different\"; if they do not show where the work was, answer \"unsure\".\nAnswer \"unsure\" only when the names and the contracts leave a real doubt either way (for example a short or common\nname with no contract information).",brief:"You review a procurement planning brief that an assistant wrote for a real tender, as of the tender's\nnotice date. You get the package, the brief, the records the brief cites (texts may be cut off), and what actually\nhappened later. Answer four questions.\n\n1. timeline_ok: does the actual notice-to-signing duration lie inside the P10-P90 range the BRIEF gives for this\n   package? Read the range from the brief: the model forecast (\"P10 x, P90 y\"); if the brief has no model forecast,\n   the peer-group range it states (its P10, or 0 if none is given, to its 90th percentile). Read the actual number\n   of days from the ACTUAL OUTCOME. Report the three numbers (-1 for one that is not there): the answer is \"yes\" when\n   P10 <= actual <= P90 and \"no\" when the actual is outside or the brief gives no range; it is computed from your\n   numbers. Ignore the \"model A range\" in the outcome line: it is a later recomputation, not part of the brief.\n2. precedents: for EACH precedent listed under \"Similar precedents\", is it relevant? Relevant means the past contract\n   bought the same kind of works, goods or services (both rural road works, both vehicles, both supervision of works),\n   so its procurement experience informs this package. Country and method do not matter. Not relevant: another kind\n   of item or service, even in the same sector, or a description too vague to tell. List nothing if the brief says\n   \"none\".\n3. risks: for EACH numbered risk under \"Risks and mitigations\", is it relevant and sensible? It is, unless (a) it is\n   about another kind of activity than this package (works-contractor problems for a consulting assignment, rainy\n   seasons for software), (b) it is not a procurement or contract-delivery risk at all (a policy or social outcome),\n   or (c) its mitigation does not address the risk. A generic risk that does apply to this package counts as relevant.\n4. any_unsupported_claim: list every factual claim in the brief that is NOT supported by the records it cites (or\n   the package text), each as a short quote; the answer is \"yes\" when the list is not empty. Claims are numbers,\n   dates, durations, firms, methods, countries or regions, amounts, what a past contract or document says, and each\n   precedent's reason for being similar. Check in particular what the brief says about the precedents (their method,\n   country or region, number of firms, duration) against each precedent's own record. A claim that misstates a\n   record is unsupported. NOT claims, never unsupported: the \"Status:\" line, headings, \"none (no close precedent\n   found)\", evidence-gap statements, restatements of the package, arithmetic on cited numbers, and generic mitigation\n   advice. A record that is cut off is not by itself a reason; a detail that appears nowhere in the visible records is."};
const KEY='panel_adjudication_v1';
let S={};
try{S=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){S={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){} prog()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function key(it){return it.type+':'+it.id}
function st(k){if(!S[k])S[k]={answers:{},blind:{},revealed:false,notes:''};return S[k]}
function answered(it){const s=st(key(it));return it.questions.every(q=>s.answers[q.field]!==undefined)}
function setv(k,field,value){const s=st(k);s.answers[field]=value;if(!s.revealed)s.blind[field]=value;save()}
function reveal(k){const it=ITEMS.find(i=>key(i)===k);if(!it||!answered(it))return false;st(k).revealed=true;save();return true}
function note(k,v){st(k).notes=v;save()}
function qHtml(it,q){const k=key(it),s=st(k),cur=s.answers[q.field];
 const btns=q.options.map(o=>`<button class="${cur===o[0]?'on':''}" data-act="set" data-k="${esc(k)}" data-f="${esc(q.field)}" data-v="${esc(o[0])}">${esc(o[1])}</button>`).join('');
 const changed=s.revealed&&s.blind[q.field]!==undefined&&s.blind[q.field]!==cur?`<div class="changed">changed after seeing the votes (blind answer: ${esc(s.blind[q.field])})</div>`:'';
 const votes=s.revealed?`<div class="votes">${q.votes.map(v=>`<div><b style="display:inline">${esc(v.judge)}:</b> ${esc(v.vote)} <span class="muted">${esc(v.why)}</span></div>`).join('')}</div>`:'';
 const listed=q.n_listed?` <span class="muted">(${esc(Math.round(Number(q.n_listed)))} listed)</span>`:'';
 return `<div class="q"><b>${esc(q.question)}${listed}</b>${btns}${changed}${votes}</div>`}
function cardHtml(it){const k=key(it),s=st(k),done=answered(it);
 let head;
 if(it.type==='pair'){head=`<div class="muted">pair ${esc(it.id)} | country ${esc(it.country)}</div>
  <div class="names"><div>A: <b style="display:inline">${esc(it.a)}</b></div><div>B: <b style="display:inline">${esc(it.b)}</b></div></div>
  <details><summary>Contracts of each record</summary><pre>A:\n${esc(it.ca||'  (none on record)')}\n\nB:\n${esc(it.cb||'  (none on record)')}</pre></details>`}
 else{head=`<div class="muted">${esc(it.id)} | ${esc(it.country)} | ${esc(it.category)} | ${esc(it.method)} | notice ${esc(it.notice_date)}</div>
  <p><b style="display:inline">Package:</b> ${esc(it.description)}</p>
  <details open><summary>Brief</summary><pre>${esc(it.brief)}</pre></details>
  <details><summary>Cited records (${it.cited.length})</summary><pre>${it.cited.map(c=>'['+esc(c.id)+'] '+esc(c.text)).join('\n\n')}</pre></details>
  <details><summary>Actual outcome</summary><p>${esc(it.actual)}</p></details>`}
 const btn=s.revealed?'<span class="muted">Panel votes shown below each question.</span>'
  :`<button data-act="reveal" data-k="${esc(k)}" ${done?'':'disabled'}>Show panel votes</button><span class="muted">${done?'':' answer first, then the votes can be shown'}</span>`;
 return `<div class="card ${done?'done':''}" id="card-${esc(k)}">${head}${it.questions.map(q=>qHtml(it,q)).join('')}
  <div>${btn}</div><div class="q"><b>Notes (optional)</b><textarea rows="2" data-act="note" data-k="${esc(k)}">${esc(s.notes||'')}</textarea></div></div>`}
function renderCard(k){const it=ITEMS.find(i=>key(i)===k);const el=document.getElementById('card-'+k);if(it&&el)el.outerHTML=cardHtml(it)}
function render(){
 for(const part of ['A','B']){const type=part==='A'?'pair':'brief',list=ITEMS.filter(i=>i.type===type);
  document.getElementById(part).innerHTML=`<details><summary>Rubric (the same instructions the judges got)</summary><pre>${esc(RUBRIC[type])}</pre></details>`+
   (list.length?list.map(cardHtml).join(''):'<p class="muted">No disagreements in this part.</p>')}
 prog()}
function prog(){const n=t=>ITEMS.filter(i=>i.type===t),d=t=>n(t).filter(answered).length;
 const el=document.getElementById('prog');if(el)el.textContent=`Part A: ${d('pair')}/${n('pair').length} pairs decided | Part B: ${d('brief')}/${n('brief').length} briefs decided (saved automatically in this browser)`}
function show(t){for(const p of ['A','B']){document.getElementById(p).style.display=p===t?'':'none';document.getElementById('t'+p).className=p===t?'on':''}}
function csvText(){const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
 const rows=[['item_type','item_id','field','owner_value','blind_value','revealed','changed_after_reveal','notes']];
 for(const it of ITEMS){const s=st(key(it));for(const qq of it.questions){const v=s.answers[qq.field],b=s.blind[qq.field];
  rows.push([it.type,it.id,qq.field,v,b,s.revealed?1:0,(s.revealed&&b!==undefined&&v!==b)?1:0,s.notes])}}
 return rows.map(r=>r.map(q).join(',')).join('\n')+'\n'}
function exportCsv(){const blob=new Blob([csvText()],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='adjudication_decisions.csv';document.body.appendChild(a);a.click();a.remove()}
const THEMES=['system','light','dark'];let theme='system';try{theme=localStorage.getItem(KEY+'_theme')||'system'}catch(e){}
function applyTheme(){if(theme==='system')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',theme);
 const b=document.getElementById('theme');if(b)b.textContent='Theme: '+theme;try{localStorage.setItem(KEY+'_theme',theme)}catch(e){}}
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;const act=t.dataset.act;
 if(act==='set'){setv(t.dataset.k,t.dataset.f,t.dataset.v);renderCard(t.dataset.k)}
 else if(act==='reveal'){if(reveal(t.dataset.k))renderCard(t.dataset.k)}
 else if(act==='tab'){show(t.dataset.tab);window.scrollTo(0,0)}
 else if(act==='csv'){exportCsv()}
 else if(act==='theme'){theme=THEMES[(THEMES.indexOf(theme)+1)%3];applyTheme()}});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.act==='note')note(t.dataset.k,t.value)});
applyTheme();render();show(ITEMS.some(i=>i.type==='pair')?'A':'B');
</script></body></html>
